name: One-time Agent completed PR ref retirement (keep PA-02)
on:
  pull_request:
    paths:
      - .github/workflows/agent-merged-pr-ref-retirement-20261012.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-merged-pr-ref-retirement-20261012.yml
permissions:
  contents: write
  pull-requests: read
jobs:
  verify-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: SHA-pin completed Agent ancestry and keep unfinished PA-02 intact
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const execute=context.eventName==='push'&&context.ref==='refs/heads/main';
            if(owner!=='jiangxng'||repo!=='EVO-App-Platform')throw Error('Wrong repo');
            const targets=[{"pr":570,"branch":"docs/personal-agent-blueprint-20261010","sha":"8899d6df38d01f00f9cf4ad18dbf831a14c7406c"},{"pr":575,"branch":"agent/pa01a-contextual-turn-identity-20261010","sha":"a3cf919a698a63a76f926bf264bc02fca2877626"},{"pr":577,"branch":"agent/pa01b-assistance-contract-20261010","sha":"15f059da4d841e2bc1b6b84b0171bb1be0827797"},{"pr":579,"branch":"agent/pa01b2-page-assistance-20261010","sha":"a6adbca28403ea75852cd02a7bd56652a79900db"},{"pr":638,"branch":"agent/pa01b2-native-chromium-preflight-20261011","sha":"56a18615efdd6029ddf9057b85510b43b835fe8c"},{"pr":691,"branch":"agent/pa01b3-authorized-mapping-receipt-browser-20261011","sha":"4692555eaa730c013f7c044f1b25e2e61825e350"}];
            const unfinished={pr:692,branch:'agent/pa02a-postgres-async-uniqueness-proof-20261011',sha:'9f794cf928d9a01e55a22c6d5742ea23fd7bc456'};
            const selfBranch='chore/agent-completed-ref-retirement-20261012';
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            if(execute&&main!==context.sha)throw Error('Main advanced since workflow trigger; fail closed');
            const ref=async name=>{try{return (await github.rest.git.getRef({owner,repo,ref:'heads/'+name})).data.object.sha}
            catch(e){if(e.status===404)return null;throw e;}};
            const unpr=(await github.rest.pulls.get({owner,repo,pull_number:unfinished.pr})).data;
            if(unpr.merged_at||unpr.state!=='closed'||unpr.head.ref!==unfinished.branch||unpr.head.sha!==unfinished.sha)
             throw Error('Unfinished PA-02 status changed: retain for review');
            if(await ref(unfinished.branch)!==unfinished.sha)throw Error('Unfinished PA-02 branch missing or moved');
            const cmpUn=(await github.rest.repos.compareCommits({owner,repo,base:unfinished.sha,head:main})).data;
            if(cmpUn.merge_base_commit?.sha===unfinished.sha&&cmpUn.behind_by===0)
             throw Error('Unfinished PA-02 is included in main unexpectedly; do not retire');
            const reserved=async()=>{
             const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
             const set=new Set(['main',unfinished.branch]);
             for(const pr of open){set.add(pr.base.ref);if(pr.head.repo?.full_name===owner+'/'+repo)set.add(pr.head.ref);}
             return set;
            };
            for(const r of targets){
             const p=(await github.rest.pulls.get({owner,repo,pull_number:r.pr})).data;
             if(!p.merged_at||p.state!=='closed'||p.head.ref!==r.branch||p.head.sha!==r.sha||p.head.repo?.full_name!==owner+'/'+repo)
               throw Error('Completed PR provenance mismatch #'+r.pr);
             const c=(await github.rest.repos.compareCommits({owner,repo,base:r.sha,head:main})).data;
             if(c.behind_by!==0||c.merge_base_commit?.sha!==r.sha)
               throw Error('Completed commit is not ancestor of main #'+r.pr);
             const current=await ref(r.branch);
             if(current===null){core.info('ALREADY_ABSENT #'+r.pr+' '+r.branch);continue;}
             if(current!==r.sha)throw Error('Head SHA changed #'+r.pr);
             const b=(await github.rest.repos.getBranch({owner,repo,branch:r.branch})).data;
             if(b.protected)throw Error('Protected branch '+r.branch);
             if((await reserved()).has(r.branch))throw Error('Active PR still refers to '+r.branch);
             if(!execute){core.info('AUDIT_ONLY #'+r.pr+' '+r.branch+' @ '+r.sha);continue;}
             if(await ref(r.branch)!==r.sha)throw Error('Ref moved before delete '+r.branch);
             if((await reserved()).has(r.branch))throw Error('New PR claimed '+r.branch);
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+r.branch});
             core.info('DELETED_COMPLETED #'+r.pr+' '+r.branch+' @ '+r.sha);
            }
            if(execute){
             const selfList=(await github.rest.pulls.list({owner,repo,head:owner+':'+selfBranch,state:'closed',per_page:100})).data;
             const self=selfList.find(p=>p.merged_at&&p.state==='closed'&&p.base.ref==='main'&&p.head.ref===selfBranch);
             if(!self||!self.head.sha)throw Error('Cleanup PR not verified merged into main');
             const c=(await github.rest.repos.compareCommits({owner,repo,base:self.head.sha,head:main})).data;
             if(c.behind_by!==0||c.merge_base_commit?.sha!==self.head.sha)throw Error('Cleanup PR head not in main');
             if(await ref(selfBranch)!==self.head.sha||(await reserved()).has(selfBranch))throw Error('Cleanup source ref moved or is in-use');
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+selfBranch});
             core.info('DELETED_OWN_CLEANUP_BRANCH '+selfBranch);
             if(await ref(unfinished.branch)!==unfinished.sha)throw Error('Unfinished PA-02 branch must remain');
             core.info('RETIREMENT_COMPLETE_6; UNFINISHED_PA02_RETAINED');
            }else core.info('AUDIT_ONLY_6; pending completion PR merge; PA02 stays retained');
