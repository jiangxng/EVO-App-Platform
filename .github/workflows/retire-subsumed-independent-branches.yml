name: Prune verified content-subsumed non-Agent non-2D branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-subsumed-independent-branches.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only; do not create archive tags or delete branches
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: platform-non-agent-non-2d-subsumed-prune
  cancel-in-progress: false

jobs:
  verify-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch exact source branch objects for immutable local diff
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Delete only branch heads whose complete original delta is identical on main
        uses: actions/github-script@v7
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const {owner,repo} = context.repo;
            const fullName=owner+'/'+repo;
            const dryRun=context.eventName==='workflow_dispatch' &&
              context.payload.inputs?.dry_run!=='false';
            const origin=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            const mainSha=origin.data.commit.sha;
            if (mainSha!==context.sha) {
              core.setFailed('Main moved; rerun at latest main.'); return;
            }
            const prs=await github.paginate(github.rest.pulls.list,{
              owner,repo,state:'open',per_page:100
            });
            const inUse=new Set(['main']);
            for(const pr of prs) {
              inUse.add(pr.base.ref);
              if(pr.head.repo?.full_name===fullName) inUse.add(pr.head.ref);
            }
            const skipName=/^(?:agent\/|eog\/|docs\/personal-agent|docs\/external-agent|feat\/external-agent|feat\/ea4a-|feat\/2d-|feat\/diagram-|feat\/eog-|feat\/projection-|feat\/enterprise-software-projection|fix\/eog-|docs\/diagram-|chore\/diagram-|architecture\/sop-designer-|release\/|production\/|staging\/|deploy\/)/i;
            const skipPath=/(?:^|\/)(?:agent|eog|2d-designer|2d-viewer|operating-graph|definition-projection|diagram)(?:\/|[.-])|^vendor\/eidos\/src\/diagram\//i;
            const run=(args)=>{
              const r=spawnSync('git',args,{encoding:'utf8',maxBuffer:8*1024*1024});
              if(r.error) throw r.error;
              if(r.status!==0) throw new Error('git '+args[0]+' exit '+r.status+': '+r.stderr.slice(0,200));
              return r.stdout;
            };
            const branches=await github.paginate(github.rest.repos.listBranches,{
              owner,repo,per_page:100
            });
            const report={mainSha,dryRun,checked:0,alreadyMerged:[],contentSubsumed:[],protected:[],
              unmatched:[],failed:[]};
            for(const branch of branches) {
              report.checked++;
              const name=branch.name;
              const tip=branch.commit.sha;
              if(branch.protected||inUse.has(name)||skipName.test(name)){
                report.protected.push(name);continue;
              }
              try {
                const ancestor=run(['merge-base',mainSha,tip]).trim();
                const touched=run(['diff','--name-only','--no-renames','-z',ancestor,tip,'--'])
                  .split('\u0000').filter(Boolean);
                if(touched.length>250||touched.some(path=>skipPath.test(path))){
                  report.protected.push(name);continue;
                }
                const ancestry=spawnSync('git',['merge-base','--is-ancestor',tip,mainSha],{
                  encoding:'utf8',maxBuffer:8*1024*1024
                });
                if(ancestry.error||![0,1].includes(ancestry.status)){
                  throw new Error('Ancestry verification failed');
                }
                const included=ancestry.status===0;
                const compare=spawnSync('git',['diff','--quiet',mainSha,tip,'--',...touched],{
                  encoding:'utf8',maxBuffer:8*1024*1024
                });
                if(compare.error||![0,1].includes(compare.status)) {
                  throw new Error('git comparison failed: '+String(compare.stderr||compare.error));
                }
                if(!included && compare.status!==0) { report.unmatched.push(name);continue; }
                const kind=included?'alreadyMerged':'contentSubsumed';
                if(dryRun) { report[kind].push('DRY_RUN '+name);continue; }
                const currentMain=await github.rest.repos.getBranch({owner,repo,branch:'main'});
                if(currentMain.data.commit.sha!==mainSha) {
                  throw new Error('Main advanced during verification; stop before deletion');
                }
                const latest=await github.rest.repos.getBranch({owner,repo,branch:name});
                if(latest.data.commit.sha!==tip||latest.data.protected) {
                  report.protected.push(name);continue;
                }
                const latestPrs=await github.rest.pulls.list({
                  owner,repo,head:owner+':'+name,state:'open',per_page:100
                });
                if(latestPrs.data.length){report.protected.push(name);continue;}
                if(!included){
                  const tag='archive/converged-20261011/'+name;
                  await github.rest.git.createRef({owner,repo,ref:'refs/tags/'+tag,sha:tip});
                }
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+name});
                report[kind].push(name);
              }catch(error){
                report.failed.push({branch:name,reason:String(error.message||error)});
              }
            }
            core.info(JSON.stringify(report,null,2));
            await core.summary.addHeading('Immutable non-Agent/non-2D branch content audit')
              .addRaw('Main: '+mainSha+'\n')
              .addRaw('Scanned: '+report.checked+
                ', retired ancestry: '+report.alreadyMerged.length+
                ', retired content-subsumed (tagged): '+report.contentSubsumed.length+
                ', protected: '+report.protected.length+
                ', still unique: '+report.unmatched.length+
                ', failures: '+report.failed.length+'\n')
              .addCodeBlock(JSON.stringify(report,null,2),'json').write();
            if(report.failed.length) core.setFailed('Review failures; no unsafe merges made.');
