name: Agent PA-02C Atomic Run Cancellation Integration
on:
  pull_request:
    paths:
      - "agents/enterprise-agent/pa02a-postgres-durability-proof.ts"
      - "agents/enterprise-agent/pa02b-postgres-coordination.ts"
      - "agents/enterprise-agent/pa02c-atomic-run-cancel.ts"
      - "agents/enterprise-agent/pa02b-owner-reconciliation.ts"
      - "manager/agent-async-read-worker-runtime.ts"
      - "tests/agent-line/pa02c-host-owner-cancel-visible.test.mjs"
      - "docs/agent-line/PA02C-HOST-OWNER-CANCELLATION-RECOVERY-20261014.md"
      - "tests/agent-line/pa02c-atomic-run-cancel.test.mjs"
      - ".github/workflows/agent-pa02c-atomic-run-cancel.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-run-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentproof
          POSTGRES_PASSWORD: agentproof
          POSTGRES_DB: agentproof
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U agentproof -d agentproof"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      PA02A_PROOF_DATABASE_URL: postgres://agentproof:agentproof@127.0.0.1:5432/agentproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/agent-line/pa02a-postgres-proof.test.mjs tests/agent-line/pa02b-fencing-outbox.test.mjs tests/agent-line/pa02c-cancellation.test.mjs tests/agent-line/pa02c-atomic-run-cancel.test.mjs
