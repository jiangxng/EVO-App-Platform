name: One-time Platform Tail Ref Retirement
on:
  pull_request:
    paths:
      - "repository-hygiene/platform-tail-ref-retirement-20261011.json"
      - ".github/workflows/platform-tail-ref-retirement-20261011.yml"
  push:
    branches: [main]
    paths:
      - "repository-hygiene/platform-tail-ref-retirement-20261011.json"
permissions:
  contents: write
  pull-requests: read
jobs:
  verify-merged-pr-heads:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Audit PR merge provenance and optionally delete exact squash PR heads
        uses: actions/github-script@v7
        env:
          SQUASH_REF_EXECUTE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          script: |
            const fs=require('node:fs');
            const owner=context.repo.owner,repo=context.repo.repo;
            const execute=process.env.SQUASH_REF_EXECUTE==='true';
            if(owner!=='jiangxng'||repo!=='EVO-App-Platform')throw Error('Wrong repository');
            if(execute && (context.eventName!=='push'||context.ref!=='refs/heads/main'))throw Error('Execution on main push only');
            const approved=new Map([[743,'chore/retire-merged-platform-squash-heads-20261011'],
              [723,'docs/platform-convergence-research-handoff-20261011'],
              [757,'fix/plugin-title-localization-20261011'],
              [759,'fix/tr01-runtime-authority-guard-20261011']]);
            const onlyAncestor='chore/prune-functionally-converged-nonparallel-20261011';
            const manifest=JSON.parse(fs.readFileSync('repository-hygiene/platform-tail-ref-retirement-20261011.json','utf8'));
            if(manifest.schemaVersion!==1 || manifest.scope!=='platform-tail-five-refs-20261011' ||
            !Array.isArray(manifest.records) || manifest.records.length!==5)throw Error('Invalid tail-ref retirement manifest');
            const shaRe=/^[0-9a-f]{40}$/i;
            const seen=new Set();
            for(const r of manifest.records){
              if(!shaRe.test(r.expectedHeadSha) || seen.has(r.head))throw Error('Invalid/duplicate source ref');
              if(r.kind==='ancestor'){
                if(r.head!==onlyAncestor || r.expectedHeadSha!=='56063b50802697fcbdddf772683a4b9d174907ba' ||
                   r.number!==undefined || r.mergeCommitSha!==undefined)throw Error('Unapproved ancestor ref');
              } else if(r.kind==='merged-pr'){
                if(approved.get(r.number)!==r.head || !shaRe.test(r.mergeCommitSha))throw Error('Unapproved merged PR ref');
              } else throw Error('Invalid source retirement kind');
              seen.add(r.head);
            }
            if(seen.size!==5 || !seen.has(onlyAncestor))throw Error('Incomplete approved source inventory');
            const open=async()=>{
            const p=await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
            if(p.data.length>=100)throw Error('Unbounded open PR set');
            const reserved=new Set(['main']);
            for(const pr of p.data){reserved.add(pr.base.ref);if(pr.head.repo?.full_name===owner+'/'+repo)reserved.add(pr.head.ref);}
            return reserved;
            };
            const reserved=await open();
            const actualMain=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const baseline=await github.rest.repos.compareCommits({owner,repo,base:manifest.baselineMainSha,head:actualMain});
            if(baseline.data.behind_by!==0||baseline.data.merge_base_commit?.sha!==manifest.baselineMainSha)throw Error('Main history changed');
            for(const r of manifest.records){
              if(reserved.has(r.head))throw Error('Open PR uses '+r.head);
              if(r.kind==='merged-pr'){
                const pr=(await github.rest.pulls.get({owner,repo,pull_number:r.number})).data;
                if(!pr.merged || pr.state!=='closed' || pr.base.ref!=='main' ||
                   pr.head.repo?.full_name!==owner+'/'+repo || pr.head.ref!==r.head ||
                   pr.head.sha!==r.expectedHeadSha || pr.merge_commit_sha!==r.mergeCommitSha)
                  throw Error('Merged PR provenance mismatch #'+r.number);
                const cmp=await github.rest.repos.compareCommits({owner,repo,base:r.mergeCommitSha,head:actualMain});
                if(cmp.data.behind_by!==0 || cmp.data.merge_base_commit?.sha!==r.mergeCommitSha ||
                   !['ahead','identical'].includes(cmp.data.status))
                  throw Error('PR merge commit not in main #'+r.number);
              } else {
                const cmp=await github.rest.repos.compareCommits({owner,repo,base:r.expectedHeadSha,head:actualMain});
                if(cmp.data.behind_by!==0 || cmp.data.merge_base_commit?.sha!==r.expectedHeadSha ||
                   !['ahead','identical'].includes(cmp.data.status))
                  throw Error('Retirement candidate not main ancestor: '+r.head);
              }
              const ref=await github.rest.git.getRef({owner,repo,ref:'heads/'+r.head});
              if(ref.data.object.sha!==r.expectedHeadSha)throw Error('Moved source ref '+r.head);
              const branch=(await github.rest.repos.getBranch({owner,repo,branch:r.head})).data;
              if(branch.protected)throw Error('Protected branch '+r.head);
              core.info('TAIL_REF_VERIFIED '+r.head+' '+r.expectedHeadSha);
            }
            if(!execute){core.info('AUDIT_ONLY (no deletion)');return;}
            const latest=await open();
            for(const r of manifest.records)if(latest.has(r.head))throw Error('Opened PR during audit: '+r.head);
            for(const r of manifest.records){
              const ref=await github.rest.git.getRef({owner,repo,ref:'heads/'+r.head});
              if(ref.data.object.sha!==r.expectedHeadSha)throw Error('Ref moved: '+r.head);
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+r.head});
              core.info('DELETED_TAIL_REF '+r.head+' '+r.expectedHeadSha);
            }
            core.info('EXECUTED_FIVE_TAIL_REFS; independently re-enumerate branches');
            
