name: CV05 Isolated Live LLM Acceptance (manual)

# Never triggered on push, pull_request, or Tokyo deployment. The
# live Provider test spends real tokens and requires isolated credentials.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Isolated inference Provider"
        type: choice
        required: true
        options:
          - openai
          - deepseek
      model:
        description: "Explicit authorized test model ID"
        type: string
        required: true
      consent:
        description: "Type I_ACCEPT_TEST_LLM_CHARGES to authorize test API charges"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cv05-live-llm-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout or secrets in admission: a manually dispatched workflow
      # on another branch must never get the isolated QA credential.
      - name: Require protected main, explicit paid-test consent and safe model
        shell: bash
        env:
          CV05_CONSENT: ${{ inputs.consent }}
          CV05_PROVIDER: ${{ inputs.provider }}
          CV05_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" || "${GITHUB_REF_PROTECTED:-false}" != "true" ]]; then
            echo "::error title=CV05_LIVE_REF_FORBIDDEN::Only protected main may run metered inference."
            exit 1
          fi
          if [[ "${CV05_CONSENT}" != "I_ACCEPT_TEST_LLM_CHARGES" ]]; then
            echo "::error title=CV05_LIVE_EXPLICIT_CONSENT_REQUIRED::Explicit paid-test consent is required."
            exit 1
          fi
          if [[ "${CV05_PROVIDER}" != "openai" && "${CV05_PROVIDER}" != "deepseek" ]]; then
            echo "::error title=CV05_LIVE_PROVIDER_NOT_ALLOWED::Only approved providers are allowed."
            exit 1
          fi
          if [[ ! "${CV05_MODEL}" =~ ^[a-zA-Z0-9._:/-]{2,80}$ ]] \
            || [[ "${CV05_MODEL}" == .* ]] \
            || [[ "${CV05_MODEL}" == /* ]] \
            || [[ "${CV05_MODEL}" == *..* ]] \
            || [[ "${CV05_MODEL}" == *://* ]]; then
            echo "::error title=CV05_LIVE_EXPLICIT_MODEL_REQUIRED::Invalid explicit model ID."
            exit 1
          fi
          echo "CV05_LIVE_MANUAL_ADMISSION_PASS"

  isolated-real-inference:
    needs: admission
    if: github.ref == 'refs/heads/main' && github.ref_protected
    # Code-level ref checks are not an authorization boundary for modified
    # branch workflow files. The repository owner MUST configure this GitHub
    # Environment with "Selected branches and tags" = main ONLY and keep
    # the dedicated key exclusively in its Environment secrets (never a
    # repository/organization-level secret). Required reviewer recommended.
    environment:
      name: cv05-live-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install repo-locked dependencies without model credentials
        run: npm ci
      - name: Run bounded isolated CV05 live llm.inference with real Domain Owner
        env:
          EVO_CV05_LIVE_LLM_CONSENT: ${{ inputs.consent }}
          EVO_CV05_LIVE_LLM_PROVIDER: ${{ inputs.provider }}
          EVO_CV05_LIVE_LLM_MODEL: ${{ inputs.model }}
          # Environment-scoped, non-production QA key ONLY. Never add this
          # name at repository/org level: doing so makes it accessible from
          # independently modified workflow files on unrelated branches.
          # The Environment MUST restrict deployments to protected main.
          EVO_CV05_LIVE_LLM_TEST_API_KEY: ${{ secrets.CV05_LIVE_QA_ENVIRONMENT_ONLY_API_KEY }}
        run: npm run test:cv05:live-llm
