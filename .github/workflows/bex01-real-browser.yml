name: BEX-01 Real Host Chromium Supplier Journey

on:
  pull_request:
    paths:
      - "apps/counterparty/**"
      - "apps/data-import/**"
      - "manager/server.ts"
      - "vendor/eidos/src/catalog-browser/**"
      - "vendor/eidos/src/app-host/page-controller.ts"
      - "vendor/eidos/src/design-language/productive-workbench-css.ts"
      - "tools/bex01/**"
      - "tests/bex01/**"
      - ".github/workflows/bex01-real-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplier-desktop-touch-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      APP_PLATFORM_MANAGED_SESSION_ENABLED: "false"
      APP_PLATFORM_EXTERNAL_AGENT_OAUTH_ENABLED: "false"
      APP_PLATFORM_EXTERNAL_AGENT_MCP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/protocol/bex01-10k-governed-paging-diagnostics.test.mjs tests/protocol/bex01-v3-synthetic-xlsx.test.mjs
      - run: python -m pip install "playwright==1.56.0"
      - run: python -m playwright install --with-deps chromium
      - name: Start isolated real Host with authorized supplier import
        run: |
          mkdir -p artifacts/bex01-browser
          node tools/bex01/isolated-host-fixture.mjs > artifacts/bex01-browser/bootstrap.log 2>&1 &
          echo $! > /tmp/bex01-browser-host.pid
          ready=0
          for i in $(seq 1 90); do
            if grep -q 'BEX01_BROWSER_FIXTURE_READY=' artifacts/bex01-browser/bootstrap.log; then ready=1; break; fi
            if ! kill -0 "$(cat /tmp/bex01-browser-host.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat artifacts/bex01-browser/bootstrap.log; exit 1; fi
      - name: Real desktop and phone-size Chromium tasks
        run: python tests/bex01/live_supplier_chromium.py
      - name: V3 actual Host source audit desktop and phone
        run: python tests/bex01/v3_source_audit_chromium.py
      - name: V3 governed row correction and revert
        run: python tests/bex01/v3_row_correction_chromium.py
      - name: "V3 batch subject constant: real isolated Host save and desktop/mobile restore"
        run: python tests/bex01/v3_batch_constant_host_chromium.py
      - name: V3 synthetic 22-column 172-row actual XLSX through Host and Chromium
        run: python tests/bex01/v3_synthetic_xlsx_172_chromium.py
      - name: V3 approved prototype vs real Host 1280px and 390px visual evidence
        run: |
          curl --fail --location --show-error --silent --retry 3 --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/jiangxng/EVO-App-Platform/af58e0abad880439d54230485305bf2b4e05decc/docs/plans/foundation-list-experience/BEX-01-IMPORT-V3-IN-CONTEXT-HIGH-FIDELITY-20261015.html \
            --output artifacts/bex01-browser/approved-v3-prototype.html
          test "$(git hash-object artifacts/bex01-browser/approved-v3-prototype.html)" = "9f57e9320eb527786ff7b737be27777eba6f8a92"
          python tests/bex01/v3_prototype_host_parity_chromium.py
      - name: V3 preserve all genuine synthetic XLSX business fields in supplier records
        run: python tests/bex01/v3_synthetic_xlsx_retained_fields_chromium.py
      - if: failure()
        run: cat artifacts/bex01-browser/bootstrap.log || true
      - name: Stop disposable Host
        if: always()
        run: |
          if [ -f /tmp/bex01-browser-host.pid ]; then
            kill "$(cat /tmp/bex01-browser-host.pid)" 2>/dev/null || true
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bex01-real-host-chromium-evidence
          path: artifacts/bex01-browser/
          if-no-files-found: warn
