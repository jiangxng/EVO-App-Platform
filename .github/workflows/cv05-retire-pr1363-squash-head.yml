name: CV05 Retire Verified PR1363 Squash Head

# Single-target, single-trigger retirement. Do NOT run generic bulk pruning:
# PR #1363 was squash-merged, so normal Branch Hygiene safely declined ancestry.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cv05-retire-pr1363-squash-head.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  retire-exact-cv05-pr-head:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare exact merged file blobs and retire only PR1363 head
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='jiangxng'||repo!=='EVO-App-Platform')throw Error('CV05_RETIRE_WRONG_REPO');
            const number=1363;
            const branch='test/cv05-deepseek-live-cost-guard-20261119';
            const expected='5f623c4f88be1339aaa974819ea9a2c3fab64367';
            const mergeSha='78017e1d57f3af8290517b779b5442e991185cec';
            const approved=[
              'docs/plans/foundation-list-experience/CV05-MVP-0506-20261118-LIVE-LLM-ACCEPTANCE.md',
              'docs/plans/foundation-list-experience/CV05-WINDOW-20261119-RESEARCH-REFERENCE-INDEX.md',
              'tests/integration/cv02-personal-agent-authorized-collection.test.mjs',
              'tests/protocol/cv05-deepseek-live-budget.test.mjs',
              'tools/agent-line/cv05-deepseek-live-budget.mjs'
            ].sort();
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if(!pr.merged||pr.state!=='closed'||pr.base.ref!=='main'||
               pr.head.ref!==branch||pr.head.sha!==expected||
               pr.head.repo?.full_name!==owner+'/'+repo||
               pr.merge_commit_sha!==mergeSha){
              throw Error('CV05_RETIRE_PR_PROVENANCE_MISMATCH');
            }
            const files=await github.paginate(github.rest.pulls.listFiles,{
              owner,repo,pull_number:number,per_page:100
            });
            if(JSON.stringify(files.map(f=>f.filename).sort())!==JSON.stringify(approved)){
              throw Error('CV05_RETIRE_UNEXPECTED_PR_FILES');
            }
            const actualMain=(await github.rest.repos.getBranch({
              owner,repo,branch:'main'
            })).data.commit.sha;
            if(context.sha!==actualMain){
              throw Error('CV05_RETIRE_MAIN_MOVED');
            }
            const ancestor=(await github.rest.repos.compareCommits({
              owner,repo,base:mergeSha,head:actualMain
            })).data;
            if(ancestor.merge_base_commit?.sha!==mergeSha||
               !['ahead','identical'].includes(ancestor.status)){
              throw Error('CV05_RETIRE_MERGE_NOT_ON_MAIN');
            }
            const ref=async()=>{
              try {
                return (await github.rest.git.getRef({
                  owner,repo,ref:'heads/'+branch
                })).data.object.sha;
              }catch(e){
                if(e.status===404)return null;
                throw e;
              }
            };
            if(await ref()===null){
              core.info('CV05_PR1363_BRANCH_ALREADY_ABSENT');return;
            }
            if(await ref()!==expected)throw Error('CV05_RETIRE_HEAD_MOVED');
            const info=(await github.rest.repos.getBranch({
              owner,repo,branch
            })).data;
            if(info.protected)throw Error('CV05_RETIRE_PROTECTED_BRANCH');
            const open=await github.paginate(github.rest.pulls.list,{
              owner,repo,state:'open',per_page:100
            });
            if(open.some(p=>p.base.ref===branch||
               (p.head.repo?.full_name===owner+'/'+repo&&p.head.ref===branch))){
              throw Error('CV05_RETIRE_ACTIVE_REFERENCE');
            }
            for(const path of approved){
              const read=async(at)=>{
                const {data}=await github.rest.repos.getContent({
                  owner,repo,path,ref:at
                });
                if(Array.isArray(data)||data.type!=='file')throw Error('CV05_RETIRE_NOT_FILE');
                return data.sha;
              };
              if(await read(expected)!==await read(actualMain)){
                throw Error('CV05_RETIRE_BLOB_NOT_ABSORBED '+path);
              }
              core.info('CV05_PR1363_BLOB_EQUIVALENT '+path);
            }
            if(await ref()!==expected)throw Error('CV05_RETIRE_HEAD_RACED');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
            core.info('CV05_PR1363_SHA_PINNED_SQUASH_HEAD_DELETED '+branch+' @ '+expected);
