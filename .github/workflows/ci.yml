name: Platform CI

on:
  push:
    branches: [main]
    paths:
      - "manager/**"
      - "contracts/**"
      - "catalog/catalog.ts"
      - "actions/router.ts"
      - "vendor/eidos/**"
      - "tests/protocol/**"
      - "tests/manager/core-manager.test.mjs"
      - "tests/actions/router.test.mjs"
      - "tests/integration/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - "docs/architecture/PLUGIN-PROTOCOL-v0.1.md"
      - "docs/architecture/PLUGIN-PLATFORM-MAINLINE-v0.1.md"
      - "docs/architecture/PLUGIN-HOST-FOUNDATIONS-v0.1.md"
      - "docs/architecture/PLUGIN-RUNTIME-ISOLATION-v0.1.md"
      - "docs/architecture/PLUGIN-PACKAGE-INTEGRITY-v0.1.md"
      - "docs/architecture/PLUGIN-RUNTIME-OBSERVABILITY-v0.1.md"
      - "docs/architecture/PLUGIN-REMOTE-RUNTIME-v0.1.md"
      - "INVARIANTS.md"
      - "VALIDATION-CONSTITUTION.md"
      - "LLM.md"
  pull_request:
    paths:
      - "manager/**"
      - "contracts/**"
      - "catalog/catalog.ts"
      - "actions/router.ts"
      - "vendor/eidos/**"
      - "tests/protocol/**"
      - "tests/manager/core-manager.test.mjs"
      - "tests/actions/router.test.mjs"
      - "tests/integration/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - "docs/architecture/PLUGIN-PROTOCOL-v0.1.md"
      - "docs/architecture/PLUGIN-PLATFORM-MAINLINE-v0.1.md"
      - "INVARIANTS.md"
      - "VALIDATION-CONSTITUTION.md"
      - "LLM.md"

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:platform
