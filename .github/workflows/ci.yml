name: Platform CI

on:
  push:
    branches: [main]
    paths:
      - "manager/**"
      - "help/**"
      - "contracts/**"
      - "catalog/catalog.ts"
      - "tools/**"
      - "examples/plugin-manifest*.json"
      - "actions/router.ts"
      - "vendor/eidos/**"
      - "tests/protocol/**"
      - "tests/manager/core-manager.test.mjs"
      - "tests/actions/router.test.mjs"
      - "tests/integration/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - "docs/architecture/DEPENDENCY-REPRODUCIBILITY-v0.1.md"
      - "docs/architecture/PLATFORM-HELP-SYSTEM-v0.1.md"
      - "docs/architecture/PLATFORM-SECRETS-v0.1.md"
      - "docs/architecture/EVO-WORKBENCH-v0.1.md"
      - "docs/architecture/APP-OWNED-LOCALIZATION-v0.1.md"
      - "docs/architecture/PLUGIN-PROTOCOL-v0.1.md"
      - "docs/architecture/PLUGIN-PLATFORM-MAINLINE-v0.1.md"
      - "docs/architecture/PLUGIN-HOST-FOUNDATIONS-v0.1.md"
      - "docs/architecture/PLUGIN-RUNTIME-ISOLATION-v0.1.md"
      - "docs/architecture/PLUGIN-PACKAGE-INTEGRITY-v0.1.md"
      - "docs/architecture/PLUGIN-RUNTIME-OBSERVABILITY-v0.1.md"
      - "docs/architecture/PLUGIN-REMOTE-RUNTIME-v0.1.md"
      - "INVARIANTS.md"
      - "VALIDATION-CONSTITUTION.md"
      - "architecture.manifest.json"
      - "architecture.boundary-policy.json"
      - "documentation.policy.json"
      - "docs/architecture/EXTENSION-BOUNDARY-CONSTITUTION-v0.1.md"
      - "docs/architecture/DOCUMENTATION-LIFECYCLE-GOVERNANCE-v0.1.md"
      - "docs/architecture/EVO-ECOSYSTEM-PROJECT-BOUNDARIES-v0.1.md"
      - "LLM.md"
  pull_request:
    paths:
      - "manager/**"
      - "help/**"
      - "contracts/**"
      - "catalog/catalog.ts"
      - "actions/router.ts"
      - "vendor/eidos/**"
      - "tests/protocol/**"
      - "tests/manager/core-manager.test.mjs"
      - "tests/actions/router.test.mjs"
      - "tests/integration/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - "docs/architecture/DEPENDENCY-REPRODUCIBILITY-v0.1.md"
      - "docs/architecture/PLATFORM-HELP-SYSTEM-v0.1.md"
      - "docs/architecture/PLATFORM-SECRETS-v0.1.md"
      - "docs/architecture/EVO-WORKBENCH-v0.1.md"
      - "docs/architecture/APP-OWNED-LOCALIZATION-v0.1.md"
      - "docs/architecture/PLUGIN-PROTOCOL-v0.1.md"
      - "docs/architecture/PLUGIN-PLATFORM-MAINLINE-v0.1.md"
      - "INVARIANTS.md"
      - "VALIDATION-CONSTITUTION.md"
      - "architecture.manifest.json"
      - "architecture.boundary-policy.json"
      - "documentation.policy.json"
      - "docs/architecture/EXTENSION-BOUNDARY-CONSTITUTION-v0.1.md"
      - "docs/architecture/DOCUMENTATION-LIFECYCLE-GOVERNANCE-v0.1.md"
      - "docs/architecture/EVO-ECOSYSTEM-PROJECT-BOUNDARIES-v0.1.md"
      - "LLM.md"

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run test:platform
