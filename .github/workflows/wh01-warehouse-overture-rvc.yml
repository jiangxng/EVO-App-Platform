name: WH-01D Overture Warehouse RVC

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wh01-warehouse-overture-rvc.yml
      - tools/warehouse-rvc-overture.mjs
      - tests/protocol/wh01-warehouse-overture-rvc.test.mjs
      - docs/roadmap/WH01-WAREHOUSE-LOCATION-EVIDENCE-v0.1.md
      - docs/roadmap/WH01-WAREHOUSE-RVC-EVIDENCE-2026-10-09.md

permissions:
  contents: read

jobs:
  warehouse-overture-rvc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run build --silent

      - name: Install bounded Parquet reader
        run: python -m pip install --disable-pip-version-check "duckdb==1.4.1"

      - name: Extract bounded real warehouse-building sample
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import datetime
          import hashlib
          import json
          import duckdb

          release = "2026-09-23.1"
          schema_version = "v2.0.0"
          data_path = (
              "s3://overturemaps-us-west-2/release/"
              + release
              + "/theme=buildings/type=building/*"
          )
          boxes = [
              {
                  "name": "los-angeles",
                  "xmin": -118.95,
                  "ymin": 33.45,
                  "xmax": -117.35,
                  "ymax": 34.55,
              },
              {
                  "name": "chicago",
                  "xmin": -88.35,
                  "ymin": 41.45,
                  "xmax": -87.20,
                  "ymax": 42.25,
              },
              {
                  "name": "dallas-fort-worth",
                  "xmin": -97.75,
                  "ymin": 32.45,
                  "xmax": -96.35,
                  "ymax": 33.35,
              },
              {
                  "name": "rotterdam-antwerp",
                  "xmin": 3.55,
                  "ymin": 51.00,
                  "xmax": 4.95,
                  "ymax": 52.20,
              },
          ]

          region_case = "CASE "
          predicates = []
          for box in boxes:
              predicate = (
                  "(bbox.xmin >= {xmin} AND bbox.xmax <= {xmax} "
                  "AND bbox.ymin >= {ymin} AND bbox.ymax <= {ymax})"
              ).format(**box)
              predicates.append(predicate)
              region_case += (
                  "WHEN " + predicate + " THEN '" + box["name"] + "' "
              )
          region_case += "ELSE 'outside' END"

          con = duckdb.connect()
          con.execute("INSTALL httpfs")
          con.execute("LOAD httpfs")
          con.execute("SET s3_region='us-west-2'")

          query = """
          SELECT
            CAST(id AS VARCHAR) AS id,
            COALESCE(CAST(names.primary AS VARCHAR), '') AS name,
            COALESCE(CAST(subtype AS VARCHAR), '') AS subtype,
            CAST(height AS DOUBLE) AS height,
            CAST(num_floors AS INTEGER) AS num_floors,
            CAST(has_parts AS BOOLEAN) AS has_parts,
            CAST(is_underground AS BOOLEAN) AS is_underground,
            COALESCE(
              CASE WHEN len(sources) > 0
                THEN CAST(sources[1].dataset AS VARCHAR)
                ELSE '' END,
              ''
            ) AS source_dataset,
            COALESCE(
              CASE WHEN len(sources) > 0
                THEN CAST(sources[1].provider AS VARCHAR)
                ELSE '' END,
              ''
            ) AS source_provider,
            COALESCE(
              CASE WHEN len(sources) > 0
                THEN CAST(sources[1].record_id AS VARCHAR)
                ELSE '' END,
              ''
            ) AS source_record_id,
            {region_case} AS rvc_region
          FROM read_parquet(
            '{data_path}',
            filename=true,
            hive_partitioning=1
          )
          WHERE class = 'warehouse'
            AND ({predicates})
          LIMIT 5000
          """.format(
              region_case=region_case,
              data_path=data_path.replace("'", "''"),
              predicates=" OR ".join(predicates),
          )

          rows = con.execute(query).fetchall()
          columns = [item[0] for item in con.description]
          if len(rows) < 1000:
              raise RuntimeError(
                  "WH01D_OVERTURE_SAMPLE_TOO_SMALL:" + str(len(rows))
              )

          sample_path = "/tmp/wh01d-overture-warehouse.jsonl"
          with open(sample_path, "w", encoding="utf-8") as handle:
              for row in rows:
                  handle.write(
                      json.dumps(
                          dict(zip(columns, row)),
                          ensure_ascii=False,
                          separators=(",", ":"),
                      )
                      + "\n"
                  )

          with open(sample_path, "rb") as handle:
              digest = hashlib.sha256(handle.read()).hexdigest()

          retrieved_at = datetime.datetime.now(
              datetime.timezone.utc
          ).isoformat().replace("+00:00", "Z")
          manifest = {
              "contractVersion": "0.1.0",
              "sourceId": "overture-buildings",
              "sourceUrl": "https://overturemaps.org/",
              "dataPath": data_path,
              "retrievedAt": retrieved_at,
              "sourceVersion": release,
              "schemaVersion": schema_version,
              "license": "ODbL-1.0",
              "attributionRequirements": (
                  "Overture Maps Foundation and underlying source attribution"
              ),
              "redistributionConstraints": (
                  "Raw sample is ephemeral CI input and is not committed or uploaded; only derived manifest/report evidence is retained."
              ),
              "adapterVersion": "wh01d-overture-rvc-v0.1",
              "sampleLimit": 5000,
              "sampleRows": len(rows),
              "boundingBoxes": boxes,
              "sampleContentDigest": "sha256:" + digest,
          }
          with open(
              "/tmp/wh01d-overture-warehouse.manifest.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")

          print(json.dumps({
              "release": release,
              "sampleRows": len(rows),
              "sampleContentDigest": manifest["sampleContentDigest"],
              "regions": [box["name"] for box in boxes],
          }, indent=2))
          PY

      - name: Run Warehouse facility semantic RVC
        shell: bash
        run: |
          set -euo pipefail
          node tools/warehouse-rvc-overture.mjs             --manifest /tmp/wh01d-overture-warehouse.manifest.json             --input /tmp/wh01d-overture-warehouse.jsonl             --report /tmp/wh01d-overture-warehouse.report.json

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(
            readFileSync(
              "/tmp/wh01d-overture-warehouse.report.json",
              "utf8"
            )
          );

          if (report.sample.totalRows < 1_000) {
            throw new Error(
              "WH01D_OVERTURE_ROW_COUNT_INVALID:"
              + report.sample.totalRows
            );
          }
          if (
            report.evidence.distinctExternalIds !== report.sample.totalRows
            || report.evidence.duplicateExternalIds !== 0
          ) {
            throw new Error("WH01D_OVERTURE_EXTERNAL_ID_EVIDENCE_INVALID");
          }
          if (report.evidence.uuidLikeExternalIds < 1) {
            throw new Error("WH01D_OVERTURE_NO_GERS_ID_EVIDENCE");
          }
          if (
            report.semanticBoundary
              .externalBuildingFeatureIsEnterpriseWarehouseIdentity !== false
            || report.semanticBoundary.gersIdIsWarehouseId !== false
            || report.semanticBoundary
              .physicalBuildingHierarchyDefinesZoneLocationBin !== false
            || report.semanticBoundary
              .externalGeometryDefinesInventoryPosition !== false
          ) {
            throw new Error("WH01D_OVERTURE_SEMANTIC_BOUNDARY_REGRESSION");
          }

          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload derived Warehouse RVC evidence only
        uses: actions/upload-artifact@v4
        with:
          name: wh01d-overture-warehouse-rvc
          path: |
            /tmp/wh01d-overture-warehouse.manifest.json
            /tmp/wh01d-overture-warehouse.report.json
          retention-days: 7
