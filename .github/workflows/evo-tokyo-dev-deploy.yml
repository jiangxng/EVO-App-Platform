name: EVO Tokyo Dev - CI-Gated Preview Release

# A merged, trusted main commit is the only source of an automatic Tokyo
# preview release. Production deployment is intentionally not part of this.
# workflow_dispatch remains available for authorized recovery releases.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Project Continuity CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  checks: read
  actions: read
  packages: write

concurrency:
  group: evo-tokyo-dev-deploy
  cancel-in-progress: false

jobs:
  preflight:
    # workflow_run holds a write-capable token; never execute PR/fork code.
    # Pin and verify the *exact* commit that passed protected-main CI.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      should_deploy: ${{ steps.verify.outputs.should_deploy }}
      target_sha: ${{ steps.verify.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify current main and actual deployable change
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "EVO_TOKYO_SKIP_STALE_MAIN target=$TARGET_SHA current=$current"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            # Only runtime/deployment changes require a new preview release.
            if ! git diff --name-only HEAD^ HEAD -- | grep -Eq '^(apps/|manager/|providers/|actions/|contracts/|vendor/|catalog/|deploy/|public/|package(-lock)?[.]json$|Dockerfile$|tsconfig[.]json$|[.]github/workflows/evo-tokyo-dev-deploy[.]yml$)'; then
              echo "EVO_TOKYO_SKIP_NON_RUNTIME_CHANGE sha=$TARGET_SHA"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Continue only after every completed check for this exact main
            # revision is green (unrelated SKIPPED jobs are allowed).
            for attempt in $(seq 1 40); do
              current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
              if [[ "$current" != "$TARGET_SHA" ]]; then
                echo "EVO_TOKYO_SKIP_SUPERSEDED sha=$TARGET_SHA"
                echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100")"
              if jq -e '[.check_runs[] | select(.name != "preflight" and .name != "deploy") | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length > 0' >/dev/null <<<"$checks"; then
                echo "::error title=EVO_TOKYO_MAIN_CI_FAILED::A main check failed; preview was not deployed."
                exit 1
              fi
              if jq -e '
                ([.check_runs[] | select(.name != "preflight" and .name != "deploy")] | any(.status != "completed") | not)
                and ([.check_runs[] | select(.name == "continuity" and .conclusion == "success")] | length > 0)
                and ([.check_runs[] | select(.name == "lightweight-host" and .conclusion == "success")] | length > 0)
                and ([.check_runs[] | select(.name == "protocol-and-core")] |
                  (length == 0 or all(.conclusion == "success")))
              ' >/dev/null <<<"$checks"; then
                echo "EVO_TOKYO_MAIN_CI_VERIFIED sha=$TARGET_SHA"
                break
              fi
              if [[ "$attempt" == 40 ]]; then
                echo "::error title=EVO_TOKYO_MAIN_CI_TIMEOUT::Timed out waiting for trusted main checks."
                exit 1
              fi
              sleep 15
            done
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
    environment: evo-tokyo-dev
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.target_sha }}
      - name: Recheck release SHA is current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$TARGET_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      # Fail fast: validate Secrets and SSH readiness BEFORE npm tests and image build.
      - name: Validate pinned SSH secrets (without exposing their values)
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.EVO_TOKYO_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.EVO_TOKYO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_KEY" ]]; then
            echo "::error title=EVO_TOKYO_PRIVATE_KEY_MISSING::Add EVO_TOKYO_SSH_PRIVATE_KEY to the evo-tokyo-dev environment."
            exit 1
          fi
          if [[ -z "$HOST_KEYS" ]]; then
            echo "::error title=EVO_TOKYO_HOST_KEY_MISSING::Add EVO_TOKYO_SSH_KNOWN_HOSTS to the evo-tokyo-dev environment."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOST_KEYS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -F 43.167.252.197 -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
            echo "::error title=EVO_TOKYO_HOST_KEY_INVALID::Known-hosts Secret must contain a complete verified line beginning '43.167.252.197 ssh-ed25519 '. Never paste a secret into logs."
            exit 1
          fi
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/id_ed25519" >/dev/null 2>&1; then
            echo "::error title=EVO_TOKYO_PRIVATE_KEY_INVALID::Private-key Secret must contain an unencrypted multiline OpenSSH private key (not the .pub file or Tencent key ID). Do not post its contents."
            exit 1
          fi
          echo "EVO_TOKYO_SSH_SECRET_FORMAT_PASS"
      - name: SSH preflight - verify deployed identity and Docker
        shell: bash
        run: |
          set -euo pipefail
          if ! ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            evo-deploy@43.167.252.197 \
            'test "$(id -un)" = evo-deploy && test -f /opt/evo-tokyo/.env && docker compose version && docker info >/dev/null'; then
            echo "::error title=EVO_TOKYO_REMOTE_PREFLIGHT_FAILED::SSH identity, firewall port 22, or first-time Docker/bootstrap setup is not ready. Inspect the preceding SSH error, not your secret values."
            exit 1
          fi
          echo "EVO_TOKYO_REMOTE_PREFLIGHT_PASS"
      - name: Required pre-deploy platform validation
        run: |
          npm ci
          npm run test:platform
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build immutable SHA-tagged runtime image on GitHub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/jiangxng/evo-app-platform:${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=evo-tokyo-dev
          cache-to: type=gha,scope=evo-tokyo-dev,mode=max
      - name: Upload versioned Compose definition
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/tencent-tokyo/compose.yaml \
            evo-deploy@43.167.252.197:/opt/evo-tokyo/compose.yaml
      - name: Authenticate VPS to GHCR with this run's short-lived token
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            evo-deploy@43.167.252.197 \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
      - name: Deploy with readiness checks and bounded first-boot failure handling
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            evo-deploy@43.167.252.197 bash -s -- "$TARGET_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          cd /opt/evo-tokyo
          test -f .env
          # A prior attempt can have a pending/failed tag; only a confirmed
          # prior local HTTP PASS counts as a rollback target.
          previous_good=""
          if [[ -f .last-health-pass-sha ]]; then
            previous_good="$(cat .last-health-pass-sha)"
            [[ "$previous_good" =~ ^[0-9a-f]{40}$ ]] || previous_good=""
          fi
          write_release_env() {
            local rev="$1"
            umask 077
            sed '/^EVO_IMAGE=/d;/^EVO_REVISION=/d' .env > .env.new
            printf 'EVO_IMAGE=ghcr.io/jiangxng/evo-app-platform:%s\n' "$rev" >> .env.new
            printf 'EVO_REVISION=%s\n' "$rev" >> .env.new
            mv .env.new .env
          }
          on_failure() {
            local exit_code="$1"
            trap - ERR
            set +e
            echo "EVO_TOKYO_DEPLOY_FAILURE_CODE=$exit_code"
            docker compose ps --all || true
            cid="$(docker compose ps -q evo)"
            if [[ -n "$cid" ]]; then
              docker inspect --format 'EVO_STATUS={{.State.Status}} EVO_EXIT_CODE={{.State.ExitCode}} EVO_RESTARTS={{.RestartCount}} EVO_HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$cid" || true
            fi
            if [[ -n "$previous_good" ]]; then
              echo "RESTORING_PREVIOUS_LOCAL_HEALTH_PASS sha=$previous_good"
              write_release_env "$previous_good"
              if docker compose up -d --wait --wait-timeout 180; then
                echo "PREVIOUS_LOCAL_HEALTH_PASS_RESTORED"
              else
                echo "PREVIOUS_VERSION_RESTART_FAILED_INSPECT_VPS" >&2
              fi
            else
              echo "FIRST_DEPLOY_NO_VERIFIED_PRIOR_IMAGE: retaining attempted image and volumes for diagnosis; no nonexistent pending pull"
            fi
            exit "$exit_code"
          }
          trap 'on_failure "$?"' ERR
          write_release_env "$sha"
          docker compose pull evo
          # Real EVO /health container probe is part of Compose; --wait now
          # blocks until Node is actually ready, not merely process-running.
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 3 --connect-timeout 2 --max-time 8 \
            http://127.0.0.1:4100/health
          echo
          docker compose ps
          printf '%s\n' "$sha" > .last-health-pass-sha.tmp
          chmod 0640 .last-health-pass-sha.tmp
          mv .last-health-pass-sha.tmp .last-health-pass-sha
          trap - ERR
          echo "EVO_TOKYO_DEV_LOCAL_HEALTH_PASS sha=$sha"
          REMOTE
      - name: Public HTTPS acceptance from independent GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          host="evo.43.167.252.197.sslip.io"
          health="$(curl --noproxy '*' -4 --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 20 "https://$host/health")"
          printf '%s\n' "$health" | grep -Fq '"ok":true'
          printf '%s\n' "$health" | grep -Fq '"service":"evo-app-manager"'
          echo "EVO_TOKYO_PUBLIC_HTTPS_HEALTH_PASS"
          unauth="$(curl --noproxy '*' -4 --silent --show-error \
            --connect-timeout 10 --max-time 20 -o /dev/null \
            -w '%{http_code}' "https://$host/")"
          if [[ "$unauth" != "401" ]]; then
            echo "::error title=EVO_TOKYO_BASIC_AUTH_BOUNDARY_FAIL::Expected 401, received $unauth"
            exit 1
          fi
          echo "EVO_TOKYO_BASIC_AUTH_BOUNDARY_PASS"

      - name: Remove temporary SSH credentials from runner
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
