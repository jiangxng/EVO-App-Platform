name: Agent PA-04 C04 Human Memory Correction
on:
  pull_request:
    paths:
      - "manager/context-memory-proposal-service.ts"
      - "tests/protocol/pa04-c04-human-memory-correction.test.mjs"
      - ".github/workflows/agent-pa04-c04-human-memory-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  human-reviewed-memory-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/protocol/pa04-c04-human-memory-correction.test.mjs tests/protocol/context-memory-proposal-review.test.mjs tests/protocol/context-memory-governance.test.mjs
