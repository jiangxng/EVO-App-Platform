name: PA05 - Cross-business READ Certification

on:
  pull_request:
    paths:
      - ".github/workflows/agent-pa05-cross-business-read.yml"
      - "tests/agent-line/pa05-cross-business-read-certification.test.mjs"
      - "tests/agent-line/pa05-schema-cert-fixture.test.mjs"
      - "tests/agent-line/pa05-read-runtime-guard.test.mjs"
      - "certification/pa05-read-action-gateway.mjs"
      - "certification/capability-operation-schema-fixture.mjs"
      - "docs/agent-line/PA05-CERTIFICATION-BASELINE-20261015.md"
      - "certification/README.md"
      - "apps/trading-reference/**"
      - "apps/purchase-attention/**"
      - "tests/agent-line/pa05-independent-purchase-attention.test.mjs"
      - "certification/pa05-e01-host-readiness.mjs"
      - "tests/agent-line/pa05-e01-host-readiness.test.mjs"
      - "tests/agent-line/pa05-e01b-host-optin.test.mjs"
      - "tests/agent-line/pa05-e01c-on-demand-admission.test.mjs"
      - "tests/agent-line/pa05-e01d-host-admin-admission.test.mjs"
      - "manager/server.ts"
      - "manager/on-demand-host-read-admission.ts"
      - "catalog/catalog.ts"
      - "actions/router.ts"
      - "apps/purchase-attention/host-optin.ts"
      - "apps/ledger-runtime-configurator/**"
      - "agents/enterprise-agent/capability-fabric-tools.ts"
      - "manager/capability-operation-access.ts"
      - "contracts/plugin-protocol.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-pa05-cross-business-read.yml"
      - "tests/agent-line/pa05-cross-business-read-certification.test.mjs"
      - "tests/agent-line/pa05-schema-cert-fixture.test.mjs"
      - "tests/agent-line/pa05-read-runtime-guard.test.mjs"
      - "certification/pa05-read-action-gateway.mjs"
      - "certification/capability-operation-schema-fixture.mjs"
      - "apps/trading-reference/**"
      - "apps/purchase-attention/**"
      - "tests/agent-line/pa05-independent-purchase-attention.test.mjs"
      - "certification/pa05-e01-host-readiness.mjs"
      - "tests/agent-line/pa05-e01-host-readiness.test.mjs"
      - "tests/agent-line/pa05-e01b-host-optin.test.mjs"
      - "tests/agent-line/pa05-e01c-on-demand-admission.test.mjs"
      - "tests/agent-line/pa05-e01d-host-admin-admission.test.mjs"
      - "manager/server.ts"
      - "manager/on-demand-host-read-admission.ts"
      - "catalog/catalog.ts"
      - "actions/router.ts"
      - "apps/purchase-attention/host-optin.ts"
      - "apps/ledger-runtime-configurator/**"
      - "agents/enterprise-agent/capability-fabric-tools.ts"
      - "manager/capability-operation-access.ts"
      - "contracts/plugin-protocol.ts"

permissions:
  contents: read

concurrency:
  group: pa05-cross-business-read-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-plugin-read-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cross-business Human / Personal Agent parity and owner regressions
        run: >-
          node --test
          tests/agent-line/pa05-cross-business-read-certification.test.mjs
          tests/agent-line/pa05-schema-cert-fixture.test.mjs
          tests/agent-line/pa05-read-runtime-guard.test.mjs
          tests/agent-line/pa05-independent-purchase-attention.test.mjs
          tests/protocol/personal-agent-capability-fabric.test.mjs
          tests/protocol/tr01-purchase-operational-capability.test.mjs
          tests/configurator/capability-operations.test.mjs
      - name: E01A actual Host plugin composition (non-production, must remain unsigned)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/agent-line/pa05-e01-host-readiness.test.mjs | tee pa05-e01.log
          grep -Fq 'PA05_E01_HOST_COMPOSITION_PREFLIGHT=' pa05-e01.log
          grep -Fq '"defaultHostHandlerRegistered":false' pa05-e01.log
          grep -Fq '"isolatedHostCompositionReady":true' pa05-e01.log
          grep -Fq '"e01ProductionCertified":false' pa05-e01.log
          grep -Fq '"productionWriteEnabled":false' pa05-e01.log
          if grep -Eq '# skipped [1-9][0-9]*' pa05-e01.log; then exit 1; fi
      - name: E01B opt-in production Host composition (isolated, no live Provider)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/agent-line/pa05-e01b-host-optin.test.mjs | tee pa05-e01b.log
          grep -Fq 'PA05_E01B_HOST_OPTIN=' pa05-e01b.log
          grep -Fq '"defaultHostUnchanged":true' pa05-e01b.log
          grep -Fq '"installRemainsExplicit":true' pa05-e01b.log
          grep -Fq '"realProductionInstallationVerified":false' pa05-e01b.log
          grep -Fq '"productionWriteEnabled":false' pa05-e01b.log
          if grep -Eq '# skipped [1-9][0-9]*' pa05-e01b.log; then exit 1; fi
      - name: E01C Host runtime-on-demand registration (no production installation)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/agent-line/pa05-e01c-on-demand-admission.test.mjs | tee pa05-e01c.log
          grep -Fq 'PA05_E01C_ON_DEMAND_HOST_ADMISSION=' pa05-e01c.log
          grep -Fq '"loaderDeferredUntilApproval":true' pa05-e01c.log
          grep -Fq '"actualCatalogAndOriginalRouterRuntimeRegistration":true' pa05-e01c.log
          grep -Fq '"defaultHostUnchanged":true' pa05-e01c.log
          grep -Fq '"productionHostWiring":false' pa05-e01c.log
          grep -Fq '"productionWriteEnabled":false' pa05-e01c.log
          if grep -Eq '# skipped [1-9][0-9]*' pa05-e01c.log; then exit 1; fi
      - name: E01D default-off authorized Host administrator admission (no install)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/agent-line/pa05-e01d-host-admin-admission.test.mjs | tee pa05-e01d.log
          grep -Fq 'PA05_E01D_ADMIN_HOST_ADMISSION=' pa05-e01d.log
          grep -Fq '"defaultEnabled":false' pa05-e01d.log
          grep -Fq '"bootstrapTokenAndLiveAuthorizationRequired":true' pa05-e01d.log
          grep -Fq '"adminAdmissionOnlyNotInstallation":true' pa05-e01d.log
          grep -Fq '"realProductionCredentialsOrHumanCertified":false' pa05-e01d.log
          grep -Fq '"productionWriteEnabled":false' pa05-e01d.log
          if grep -Eq '# skipped [1-9][0-9]*' pa05-e01d.log; then exit 1; fi
