name: CV03 N1-05c Tokyo QA Authenticated TCP Producer

# Main-only physical validation of an isolated QA role; never production Host.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cv03-n105c-tokyo-qa-tcp-principal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv03-n105c-tokyo-qa-tcp-principal
  cancel-in-progress: false

jobs:
  authenticated-qa-producer:
    runs-on: ubuntu-24.04
    environment: evo-tokyo-dev
    timeout-minutes: 12
    steps:
      - name: Verify exact protected main and pinned Tokyo SSH key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_KEY: ${{ secrets.EVO_TOKYO_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.EVO_TOKYO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test -n "$PRIVATE_KEY" && test -n "$HOST_KEYS"
          umask 077
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOST_KEYS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          ssh-keygen -F 43.167.252.197 -f "$HOME/.ssh/known_hosts" > /dev/null
          ssh-keygen -y -P "" -f "$HOME/.ssh/id_ed25519" > /dev/null
          echo CV03_N105C_QA_MAIN_AND_SSH_PIN_PASS

      - name: Provision and test password-backed QA SQL identity without changing business database
        shell: bash
        run: |
          set -euo pipefail
          proof="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            evo-deploy@43.167.252.197 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          test "$(id -un)" = evo-deploy
          cd /opt/evo-tokyo
          test -f .env && test -r compose.yaml
          pg="$(docker compose ps -q postgres)"
          test -n "$pg"
          test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$pg")" = healthy
          test "$(df -Pk "$HOME" | awk 'NR==2 {print $4}')" -ge 2097152
          test "$(free -m | awk '/^Mem:/ {print $7}')" -ge 256
          echo CV03_N105C_QA_PG_HEALTH_AND_CAPACITY_PASS

          admin_postgres() {
            docker compose exec -T --interactive=false postgres psql -X -qAt \
              -v ON_ERROR_STOP=1 -U evo -d postgres -c "$1" < /dev/null
          }
          admin_qa() {
            docker compose exec -T --interactive=false postgres psql -X -qAt \
              -v ON_ERROR_STOP=1 -U evo -d cv03_n105b_qa -c "$1" < /dev/null
          }
          role=cv03_n105c_qa_tcp_producer
          old_role=cv03_n105b_qa_producer
          test "$(admin_postgres "SELECT current_setting('server_version_num')")" = 170011
          test "$(admin_postgres "SELECT count(*) FROM pg_database WHERE datname='evo_dev'")" = 1
          test "$(admin_postgres "SELECT count(*) FROM pg_database WHERE datname='cv03_n105b_qa'")" = 1
          functions="$(admin_qa "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid WHERE n.nspname='cv03_n105b_qa' AND p.proname IN ('cv03_n105b_commit_deny_t0','cv03_n105b_fence_package_t0')")"
          test "$functions" = 2
          test "$(admin_qa "SELECT frozen::text FROM cv03_n105b_qa.feature_authority WHERE feature_id='host-enterprise-context-provider.personal-saved-views'")" = true
          test "$(admin_qa "SELECT count(*) FROM cv03_n105b_qa.immutable_outbox")" = 2
          test "$(admin_qa "SELECT count(*) FROM cv03_n105b_qa.operation_receipts")" = 2
          echo CV03_N105C_EXISTING_ATOMIC_T0_UNCHANGED_PASS

          private="$HOME/.evo-cv03-n105c-qa-principal"
          if test -e "$private"; then
            test -d "$private" && test ! -L "$private"
            test "$(stat -c %a "$private")" = 700
          else
            install -d -m 0700 "$private"
          fi
          secret_file="$private/producer.password"
          has_role="$(admin_postgres "SELECT count(*) FROM pg_roles WHERE rolname='cv03_n105c_qa_tcp_producer'")"
          if test "$has_role" = 0; then
            test ! -e "$secret_file"
            test "$(admin_qa "SELECT count(*) FROM cv03_n105b_qa.producer_identity WHERE login_role='cv03_n105b_qa_producer' AND host_id='tokyo-qa-host-01' AND enabled")" = 1
            secret="$(openssl rand -hex 32)"
            [[ "$secret" =~ ^[a-f0-9]{64}$ ]]
            printf '%s\n' "$secret" > "$secret_file"
            chmod 600 "$secret_file"
            # This grant only affects an already-isolated QA DB. Do not change evo_dev.
            admin_postgres "SET password_encryption='scram-sha-256'; CREATE ROLE cv03_n105c_qa_tcp_producer LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 3 PASSWORD '$secret' VALID UNTIL '2026-12-01 00:00:00+00'; GRANT CONNECT ON DATABASE cv03_n105b_qa TO cv03_n105c_qa_tcp_producer;" > /dev/null
            unset secret
            echo CV03_N105C_QA_RESTRICTED_LOGIN_CREATED_PASS
            mode=created
          elif test "$has_role" = 1; then
            test -f "$secret_file" && test ! -L "$secret_file"
            test "$(stat -c %a "$secret_file")" = 600
            # Rerun only an already completed, recognized QA role. A partial
            # provisioning attempt is not silently repaired or reinitialized.
            test "$(admin_qa "SELECT count(*) FROM cv03_n105b_qa.producer_identity WHERE login_role='cv03_n105c_qa_tcp_producer' AND host_id='tokyo-qa-host-01' AND enabled")" = 1
            test "$(admin_qa "SELECT count(*) FROM cv03_n105b_qa.producer_identity WHERE login_role='cv03_n105b_qa_producer'")" = 0
            mode=audit
            echo CV03_N105C_QA_EXISTING_ROLE_AUDIT_ONLY_PASS
          else
            echo CV03_N105C_QA_ROLE_COLLISION_DENIED >&2
            exit 1
          fi
          secret="$(cat "$secret_file")"
          [[ "$secret" =~ ^[a-f0-9]{64}$ ]]
          scram="$(admin_postgres "SELECT CASE WHEN rolpassword LIKE 'SCRAM-SHA-256$%' THEN 'true' ELSE 'false' END FROM pg_authid WHERE rolname='cv03_n105c_qa_tcp_producer'")"
          test "$scram" = true
          role_flags="$(admin_postgres "SELECT rolsuper::int||','||rolcreatedb::int||','||rolcreaterole::int||','||rolbypassrls::int||','||rolinherit::int FROM pg_roles WHERE rolname='cv03_n105c_qa_tcp_producer'")"
          test "$role_flags" = 0,0,0,0,0
          # Test a password-authenticated TCP connection, not trusted socket.
          tcp_sql() {
            docker compose exec -T --interactive=false -e PGPASSWORD="$secret" postgres \
              psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 \
              -U "$role" -d cv03_n105b_qa -c "$1" < /dev/null
          }
          ident="$(tcp_sql "SELECT session_user||'|'||current_user||'|'||current_database()")"
          test "$ident" = 'cv03_n105c_qa_tcp_producer|cv03_n105c_qa_tcp_producer|cv03_n105b_qa'
          if docker compose exec -T --interactive=false -e PGPASSWORD="deliberately-invalid-password" postgres \
            psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U "$role" -d cv03_n105b_qa -c 'SELECT 1' > /dev/null 2>&1; then
            echo CV03_N105C_INVALID_TCP_PASSWORD_ACCEPTED >&2
            exit 1
          fi
          echo CV03_N105C_REAL_SCRAM_TCP_SESSION_AND_BAD_PASSWORD_DENIAL_PASS

          if test "$mode" = created; then
            # Atomically revoke prior Producer and rebind the SAME trusted Host
            # to the new SQL identity in the QA DB only.
            admin_qa "BEGIN;
              REVOKE USAGE ON SCHEMA cv03_n105b_qa FROM cv03_n105b_qa_producer;
              REVOKE EXECUTE ON FUNCTION cv03_n105b_qa.cv03_n105b_commit_deny_t0(text,text,text,text,text,text,text,bigint,text,text) FROM cv03_n105b_qa_producer;
              REVOKE EXECUTE ON FUNCTION cv03_n105b_qa.cv03_n105b_fence_package_t0(text,text,text,text,text,text) FROM cv03_n105b_qa_producer;
              REVOKE CONNECT ON DATABASE cv03_n105b_qa FROM cv03_n105b_qa_producer;
              DELETE FROM cv03_n105b_qa.producer_identity WHERE login_role='cv03_n105b_qa_producer' AND host_id='tokyo-qa-host-01';
              INSERT INTO cv03_n105b_qa.producer_identity(login_role,host_id,enabled) VALUES('cv03_n105c_qa_tcp_producer','tokyo-qa-host-01',true);
              GRANT USAGE ON SCHEMA cv03_n105b_qa TO cv03_n105c_qa_tcp_producer;
              GRANT EXECUTE ON FUNCTION cv03_n105b_qa.cv03_n105b_commit_deny_t0(text,text,text,text,text,text,text,bigint,text,text) TO cv03_n105c_qa_tcp_producer;
              GRANT EXECUTE ON FUNCTION cv03_n105b_qa.cv03_n105b_fence_package_t0(text,text,text,text,text,text) TO cv03_n105c_qa_tcp_producer;
              COMMIT;" > /dev/null
            echo CV03_N105C_OWNER_REBOUND_AND_OLD_PRODUCER_REVOKED_PASS
          fi
          test "$(admin_qa "SELECT count(*) FROM cv03_n105b_qa.producer_identity WHERE login_role='cv03_n105c_qa_tcp_producer' AND host_id='tokyo-qa-host-01' AND enabled")" = 1
          test "$(admin_qa "SELECT count(*) FROM cv03_n105b_qa.producer_identity WHERE login_role='cv03_n105b_qa_producer'")" = 0
          test "$(admin_postgres "SELECT has_function_privilege('cv03_n105c_qa_tcp_producer','cv03_n105b_qa.cv03_n105b_commit_deny_t0(text,text,text,text,text,text,text,bigint,text,text)','EXECUTE')::text FROM pg_database WHERE datname='postgres'")" = true
          echo CV03_N105C_QA_SOURCE_IDENTITY_FENCE_PASS

          before="$(admin_qa "SELECT (SELECT count(*) FROM cv03_n105b_qa.immutable_outbox)::text||'|'||(SELECT count(*) FROM cv03_n105b_qa.operation_receipts)::text")"
          test "$before" = '2|2'
          receipt="$(tcp_sql "SELECT authenticated_host_id||'|'||authority_epoch::text||'|'||replayed::text||'|'||outbox_event_id FROM cv03_n105b_qa.cv03_n105b_commit_deny_t0('tokyo-qa-host-01','qa-deny-operation-0001','enterprise-context:qa-ent-01','qa-ent-01','qa-human-01','HUMAN','qa-gen-20261111',0,'AUTHORIZATION_REVOKE','collection.saved-view.personal.save')")"
          [[ "$receipt" == tokyo-qa-host-01\|1\|true\|evt-* ]]
          after="$(admin_qa "SELECT (SELECT count(*) FROM cv03_n105b_qa.immutable_outbox)::text||'|'||(SELECT count(*) FROM cv03_n105b_qa.operation_receipts)::text")"
          test "$after" = "$before"
          echo CV03_N105C_TCP_REPLAY_WITHOUT_DUPLICATE_OUTBOX_PASS

          must_deny() {
            if tcp_sql "BEGIN; $1; ROLLBACK;" > /dev/null 2>&1; then
              echo CV03_N105C_QA_UNEXPECTED_SQL_PRIVILEGE >&2
              exit 1
            fi
          }
          must_deny "UPDATE cv03_n105b_qa.scope_authority SET enabled=true"
          must_deny "DELETE FROM cv03_n105b_qa.immutable_outbox"
          must_deny "INSERT INTO cv03_n105b_qa.operation_receipts(operation_key,input_arguments,result_fields) VALUES('unauthorized', '[]'::jsonb, '{}'::jsonb)"
          must_deny "SELECT * FROM cv03_n105b_qa.producer_identity"
          must_deny "CREATE TABLE cv03_n105b_qa.unauthorized_ddl_test(x integer)"
          must_deny "SET ROLE cv03_n105b_qa_owner"
          must_deny "SELECT * FROM cv03_n105b_qa.cv03_n105b_commit_deny_t0('fake-host-identity','qa-deny-operation-0001','enterprise-context:qa-ent-01','qa-ent-01','qa-human-01','HUMAN','qa-gen-20261111',0,'AUTHORIZATION_REVOKE','collection.saved-view.personal.save')"
          must_deny "SELECT * FROM cv03_n105b_qa.cv03_n105b_commit_deny_t0('tokyo-qa-host-01','qa-deny-operation-0001','enterprise-context:qa-ent-01','qa-ent-01','qa-wrong-subject','HUMAN','qa-gen-20261111',0,'AUTHORIZATION_REVOKE','collection.saved-view.personal.save')"
          must_deny "SELECT * FROM cv03_n105b_qa.cv03_n105b_commit_deny_t0('tokyo-qa-host-01','qa-new-operation-0002','enterprise-context:qa-ent-offline','qa-ent-offline','qa-offline-01','HUMAN','qa-gen-20261111',1,'AUTHORIZATION_REVOKE','collection.saved-view.personal.save')"
          test "$(admin_qa "SELECT (SELECT count(*) FROM cv03_n105b_qa.immutable_outbox)::text||'|'||(SELECT count(*) FROM cv03_n105b_qa.operation_receipts)::text")" = "$before"
          echo CV03_N105C_DIRECT_DML_ROLE_IMPERSONATION_SCOPE_DRIFT_AND_FROZEN_DENY_PASS

          # Old socket LOGIN is still present for QA negative checks but can no
          # longer invoke T0. This does not claim workload network security.
          if docker compose exec -T --interactive=false postgres psql -X -qAt \
            -v ON_ERROR_STOP=1 -U "$old_role" -d cv03_n105b_qa \
            -c 'SELECT 1 FROM cv03_n105b_qa.cv03_n105b_fence_package_t0('"'tokyo-qa-host-01','qa-feature-fence-0001','host-enterprise-context-provider','host-enterprise-context-provider.personal-saved-views','qa-gen-20261111','DISABLE'"');' \
            < /dev/null > /dev/null 2>&1; then
            echo CV03_N105C_OLD_SQL_PRODUCER_STILL_AUTHORIZED >&2
            exit 1
          fi
          echo CV03_N105C_OLD_LOCAL_SOCKET_PRODUCER_DENIED_PASS

          # Catalog privileges: PUBLIC may still CONNECT to original evo_dev.
          # Do not touch evo_dev ACL. Report this as an UNRESOLVED boundary,
          # never as a cross-database isolation PASS.
          source_connect="$(admin_postgres "SELECT has_database_privilege('cv03_n105c_qa_tcp_producer','evo_dev','CONNECT')::text")"
          test "$source_connect" = true -o "$source_connect" = false
          echo "CV03_N105C_QA_ORIGINAL_DB_CONNECT_VIA_CLUSTER_ACL=$source_connect"
          test "$(docker compose exec -T --interactive=false postgres psql -X -qAt \
            -v ON_ERROR_STOP=1 -U evo -d evo_dev -c "SELECT count(*) FROM pg_namespace WHERE nspname='cv03_n105b_qa'" < /dev/null)" = 0
          echo CV03_N105C_EVO_DEV_SCHEMA_UNTOUCHED_PASS
          echo CV03_N105C_REAL_TCP_PRODUCER_QA_PHYSICAL_ACCEPTANCE_PASS
          REMOTE
          )"
          printf '%s\n' "$proof"
          grep -Fxq CV03_N105C_REAL_SCRAM_TCP_SESSION_AND_BAD_PASSWORD_DENIAL_PASS <<< "$proof"
          grep -Fxq CV03_N105C_TCP_REPLAY_WITHOUT_DUPLICATE_OUTBOX_PASS <<< "$proof"
          grep -Fxq CV03_N105C_DIRECT_DML_ROLE_IMPERSONATION_SCOPE_DRIFT_AND_FROZEN_DENY_PASS <<< "$proof"
          grep -Fxq CV03_N105C_EVO_DEV_SCHEMA_UNTOUCHED_PASS <<< "$proof"
          grep -Fxq CV03_N105C_REAL_TCP_PRODUCER_QA_PHYSICAL_ACCEPTANCE_PASS <<< "$proof"
          echo CV03_N105C_QA_TERMINAL_PROOFS_ENFORCED_PASS
      - name: Remove runner SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
