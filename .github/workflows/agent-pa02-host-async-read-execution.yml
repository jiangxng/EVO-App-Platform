name: Agent PA-02 Host Async READ Execution
on:
  push:
    branches: [agent/pa02-host-async-read-execution-20261013]
    paths:
      - "manager/agent-async-read-worker-runtime.ts"
      - "manager/agent-pa02-run-outbox.ts"
      - "agents/enterprise-agent/pa02a-postgres-durability-proof.ts"
      - "tests/agent-line/pa02-host-run-outbox-replay.test.mjs"
      - "docs/agent-line/PA02-R05-R06-RUN-OUTBOX-REPLAY-20261014.md"
      - "agents/enterprise-agent/pa02c-atomic-run-cancel.ts"
      - "agents/enterprise-agent/pa02b-owner-reconciliation.ts"
      - "tests/agent-line/pa02c-host-owner-cancel-visible.test.mjs"
      - "manager/agent-pa02-sandbox-object-extension.ts"
      - "tests/agent-line/pa02-host-server-sandbox-object-owner.test.mjs"
      - "docs/agent-line/PA02-HOST-SERVER-SANDBOX-OBJECT-OWNER-20261014.md"
      - "agents/enterprise-agent/run-action-handlers.ts"
      - "agents/enterprise-agent/thread-turn-action-handlers.ts"
      - "manager/server.ts"
      - "tests/agent-line/pa02-host-async-read-execution.test.mjs"
      - ".github/workflows/agent-pa02-host-async-read-execution.yml"
  pull_request:
    paths:
      - "manager/agent-async-read-worker-runtime.ts"
      - "manager/agent-pa02-run-outbox.ts"
      - "agents/enterprise-agent/pa02a-postgres-durability-proof.ts"
      - "tests/agent-line/pa02-host-run-outbox-replay.test.mjs"
      - "docs/agent-line/PA02-R05-R06-RUN-OUTBOX-REPLAY-20261014.md"
      - "agents/enterprise-agent/run-action-handlers.ts"
      - "manager/server.ts"
      - "tests/agent-line/pa02-host-async-read-execution.test.mjs"
      - ".github/workflows/agent-pa02-host-async-read-execution.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-async-read-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentproof
          POSTGRES_PASSWORD: agentproof
          POSTGRES_DB: agentproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentproof -d agentproof"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      PA02A_PROOF_DATABASE_URL: postgres://agentproof:agentproof@127.0.0.1:5432/agentproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/agent-line/pa02-host-async-read-execution.test.mjs tests/agent-line/pa02-host-server-sandbox-object-owner.test.mjs tests/agent-line/pa02-worker-cooperative-release.test.mjs tests/agent-line/pa02c-host-owner-cancel-visible.test.mjs tests/agent-line/pa02-host-run-outbox-replay.test.mjs
