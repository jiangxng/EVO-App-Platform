name: Agent PA-04 Certified Context Window
on:
  pull_request:
    paths:
      - "agents/enterprise-agent/pa04-certified-context-window.ts"
      - "agents/enterprise-agent/pa02-async-read-worker.ts"
      - "manager/agent-async-read-worker-runtime.ts"
      - "tests/protocol/pa04-certified-context-window.test.mjs"
      - "tests/agent-line/pa04-c01-certified-context-window-pg-e2e.test.mjs"
      - ".github/workflows/agent-pa04-c01-context-window.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-request-context-window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentproof
          POSTGRES_PASSWORD: agentproof
          POSTGRES_DB: agentproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentproof -d agentproof"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      PA02A_PROOF_DATABASE_URL: postgres://agentproof:agentproof@127.0.0.1:5432/agentproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/protocol/pa04-certified-context-window.test.mjs tests/agent-line/pa04-c01-certified-context-window-pg-e2e.test.mjs
