name: Agent PA-04 C02 Derived Source Revocation
on:
  pull_request:
    paths:
      - "contracts/conversation-context.ts"
      - "manager/conversation-context-assembly.ts"
      - "manager/conversation-context-postgres-store.ts"
      - "tests/protocol/pa04-c02-derived-source-revocation.test.mjs"
      - ".github/workflows/agent-pa04-c02-source-revocation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derived-artifacts-source-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentproof
          POSTGRES_PASSWORD: agentproof
          POSTGRES_DB: agentproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentproof -d agentproof"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      PA02A_PROOF_DATABASE_URL: postgres://agentproof:agentproof@127.0.0.1:5432/agentproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/protocol/pa04-c02-derived-source-revocation.test.mjs tests/protocol/pa04-source-summary-invalidation.test.mjs tests/protocol/conversation-long-context-af02.test.mjs
