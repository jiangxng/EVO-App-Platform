name: Plugin CI - Host Secrets Provider

on:
  push:
    branches: [main]
    paths:
      - "providers/secrets/**"
      - "manager/secret-store.ts"
      - "manager/secret-governance.ts"
      - "contracts/platform-services.ts"
      - "contracts/package.ts"
      - "contracts/schema/plugin-package-v0.1.schema.json"
      - "tests/protocol/secrets-provider.test.mjs"
      - "tests/settings/plugin-settings.test.mjs"
      - "package.json"
      - ".github/workflows/plugin-host-secrets-provider.yml"
  pull_request:
    paths:
      - "providers/secrets/**"
      - "manager/secret-store.ts"
      - "manager/secret-governance.ts"
      - "contracts/platform-services.ts"
      - "contracts/package.ts"
      - "contracts/schema/plugin-package-v0.1.schema.json"
      - "tests/protocol/secrets-provider.test.mjs"
      - "tests/settings/plugin-settings.test.mjs"
      - "package.json"
      - ".github/workflows/plugin-host-secrets-provider.yml"

concurrency:
  group: plugin-host-secrets-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:plugin:host-secrets-provider
