name: Diagram Designer Integration CI

on:
  pull_request:
    paths:
      - "apps/eog-2d-designer/**"
      - "apps/eog-2d-viewer/**"
      - "tests/integration/personal-agent-current-projection.test.mjs"
      - "eog/definition-projection.ts"
      - "contracts/template-projection-gallery.ts"
      - "contracts/template-preview.ts"
      - "providers/enterprise-context/definition-projection-store.ts"
      - "vendor/eidos/src/diagram/**"
      - "tests/integration/definition-projection-*.test.mjs"
      - "tests/integration/diagram-visual-handles.test.mjs"
      - "tests/integration/diagram-snapping.test.mjs"
      - "tests/integration/diagram-snapping-tools.test.mjs"
      - "tests/integration/diagram-obstacle-spatial-index.test.mjs"
      - "tests/integration/diagram-auto-route-segment.test.mjs"
      - "tests/integration/diagram-overlapping-handles.test.mjs"
      - "tests/integration/diagram-self-loop-edit.test.mjs"
      - "tests/integration/diagram-self-loop-obstacles.test.mjs"
      - ".github/workflows/diagram-designer-integration.yml"
  push:
    branches: [main]
    paths:
      - "apps/eog-2d-designer/**"
      - "apps/eog-2d-viewer/**"
      - "tests/integration/personal-agent-current-projection.test.mjs"
      - "eog/definition-projection.ts"
      - "contracts/template-projection-gallery.ts"
      - "contracts/template-preview.ts"
      - "providers/enterprise-context/definition-projection-store.ts"
      - "vendor/eidos/src/diagram/**"
      - "tests/integration/definition-projection-*.test.mjs"
      - "tests/integration/diagram-visual-handles.test.mjs"
      - "tests/integration/diagram-snapping.test.mjs"
      - "tests/integration/diagram-snapping-tools.test.mjs"
      - "tests/integration/diagram-obstacle-spatial-index.test.mjs"
      - "tests/integration/diagram-auto-route-segment.test.mjs"
      - "tests/integration/diagram-overlapping-handles.test.mjs"
      - "tests/integration/diagram-self-loop-edit.test.mjs"
      - "tests/integration/diagram-self-loop-obstacles.test.mjs"
      - ".github/workflows/diagram-designer-integration.yml"

concurrency:
  group: diagram-designer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagram-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: >-
          node --test
          tests/integration/definition-projection-edit-save.test.mjs
          tests/integration/definition-projection-cas-store.test.mjs
          tests/integration/personal-agent-current-projection.test.mjs
          tests/integration/definition-projection-edge-routes.test.mjs
          tests/integration/eog-2d-designer-cutover.test.mjs
          tests/integration/diagram-professional-routing.test.mjs
          tests/integration/diagram-touch-cancel-wiring.test.mjs
          tests/integration/diagram-visual-handles.test.mjs
          tests/integration/diagram-snapping.test.mjs
          tests/integration/diagram-snapping-tools.test.mjs
          tests/integration/diagram-obstacle-spatial-index.test.mjs
          tests/integration/diagram-auto-route-segment.test.mjs
          tests/integration/diagram-overlapping-handles.test.mjs
          tests/integration/diagram-self-loop-edit.test.mjs
          tests/integration/diagram-self-loop-obstacles.test.mjs
