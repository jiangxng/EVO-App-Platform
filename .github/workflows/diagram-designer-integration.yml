name: Diagram Designer Integration CI

on:
  pull_request:
    paths:
      - "apps/eog-2d-designer/**"
      - "apps/eog-2d-viewer/**"
      - "eog/definition-projection.ts"
      - "contracts/template-projection-gallery.ts"
      - "contracts/template-preview.ts"
      - "vendor/eidos/src/diagram/**"
      - "tests/integration/definition-projection-*.test.mjs"
      - ".github/workflows/diagram-designer-integration.yml"
  push:
    branches: [main]
    paths:
      - "apps/eog-2d-designer/**"
      - "apps/eog-2d-viewer/**"
      - "eog/definition-projection.ts"
      - "contracts/template-projection-gallery.ts"
      - "contracts/template-preview.ts"
      - "vendor/eidos/src/diagram/**"
      - "tests/integration/definition-projection-*.test.mjs"
      - ".github/workflows/diagram-designer-integration.yml"

concurrency:
  group: diagram-designer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagram-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node --test tests/integration/definition-projection-edit-save.test.mjs tests/integration/definition-projection-edge-routes.test.mjs tests/integration/eog-2d-viewer-cutover.test.mjs tests/integration/eog-2d-designer-cutover.test.mjs
