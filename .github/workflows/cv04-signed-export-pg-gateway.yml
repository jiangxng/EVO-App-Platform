name: CV04 Signed PostgreSQL Export Gateway and Role Admission

on:
  pull_request:
    paths:
      - "tools/cv04-isolated-signed-export-gateway.mjs"
      - "tests/agent-line/cv04-signed-export-gateway-pg.test.mjs"
      - ".github/workflows/cv04-signed-export-pg-gateway.yml"
      - "docs/plans/foundation-list-experience/CV04-SIGNED-PG-EXPORT-GATEWAY-20261112.md"
  push:
    branches: [main]
    paths:
      - "tools/cv04-isolated-signed-export-gateway.mjs"
      - "tests/agent-line/cv04-signed-export-gateway-pg.test.mjs"
      - ".github/workflows/cv04-signed-export-pg-gateway.yml"
      - "docs/plans/foundation-list-experience/CV04-SIGNED-PG-EXPORT-GATEWAY-20261112.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-export-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cv04_ci
          POSTGRES_PASSWORD: cv04_ci_disposable
          POSTGRES_DB: cv04_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv04_ci -d cv04_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      CV04_EXPORT_SIGNED_GATEWAY_ONLY: "YES_DISPOSABLE_CI"
      CV04_EXPORT_TEST_DATABASE_URL: postgres://cv04_ci:cv04_ci_disposable@127.0.0.1:5432/cv04_ci
      APP_PLATFORM_CV03_HUMAN_SAVE_MODE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Genuine PostgreSQL EXECUTE-only role, signed HMAC + policy epoch, nonce replay and CAS audit
        shell: bash
        run: |
          set -o pipefail
          node --test tests/agent-line/cv04-signed-export-gateway-pg.test.mjs \
            | tee /tmp/cv04-signed-pg.log
          grep -q CV04_SIGNED_PG_EXECUTE_ONLY_CIPHERTEXT_ATOMIC_AUDIT_PASS /tmp/cv04-signed-pg.log
          grep -q CV04_SIGNED_PG_RUNTIME_ROLE_EXECUTE_ONLY_RAW_DML_DENIED_PASS /tmp/cv04-signed-pg.log
          grep -q CV04_SIGNED_PG_WRONG_PROOF_TENANT_REVOKE_EPOCH_LEASE_FAILCLOSED_PASS /tmp/cv04-signed-pg.log
          grep -q CV04_SIGNED_PG_TWO_RUNTIME_CAS_ONE_AUDIT_WINNER_PASS /tmp/cv04-signed-pg.log
          grep -q CV04_SIGNED_PG_WORKER_LEASE_RECLAIM_TTL_TOMBSTONE_PASS /tmp/cv04-signed-pg.log
          grep -q 'ℹ pass 6' /tmp/cv04-signed-pg.log
          grep -q 'ℹ skipped 0' /tmp/cv04-signed-pg.log
      - name: Existing immutable SQL audit, AES-GCM PG CAS and Owner budget regression
        shell: bash
        run: |
          set -o pipefail
          node --test tests/agent-line/cv04-dictionary-export-pg-immutable-audit.test.mjs \
            | tee /tmp/cv04-immutable.log
          grep -q 'ℹ pass 5' /tmp/cv04-immutable.log
          node --test tests/agent-line/cv04-dictionary-export-job-pg-encrypted.test.mjs \
            | tee /tmp/cv04-encrypted.log
          grep -q 'ℹ pass 5' /tmp/cv04-encrypted.log
          node --test tests/protocol/cv04-dictionary-export-job-owner.test.mjs \
            | tee /tmp/cv04-owner.log
          grep -q 'ℹ pass 8' /tmp/cv04-owner.log
      - name: Verify signed gateway remains explicit opt-in and production EXPORT inactive
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const h=readFileSync("manager/server.ts","utf8");
            const m=readFileSync("catalog/seed.ts","utf8");
            const g=readFileSync("tools/cv04-isolated-signed-export-gateway.mjs","utf8");
            if(h.includes("dictionary.collection.export.job.request")
              ||m.includes("dictionary.collection.export.job.request")
              ||!g.includes("CV04_EXPORT_GATEWAY_ISOLATED_SCHEMA_REQUIRED"))
              throw Error("CV04_SIGNED_EXPORT_PREMATURELY_REGISTERED");
            console.log("CV04_SIGNED_EXPORT_NOT_PUBLISHED_TO_HOST_PASS");
          '
