name: BEX-01 Verified PR878 Batch Review Branch Retirement
on:
  push:
    branches: [main]
    paths: [.github/workflows/bex01-batch-review-pr878-merged-ref-retirement.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  retire-exact-merged-branch:
    if: github.repository == 'jiangxng/EVO-App-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Delete only exact merged PR 878 branch after checks
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch='docs/bex01-batch-extension-review-20261015';
            const p=(await github.rest.pulls.get({owner,repo,pull_number:878})).data;
            if(!p.merged||p.base.ref!=='main'||p.head.repo?.full_name!==owner+'/'+repo||p.head.ref!==branch)
              throw Error('REFUSE unmerged or mismatched PR 878');
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            if(open.some(x=>x.base.ref===branch||(x.head.repo?.full_name===owner+'/'+repo&&x.head.ref===branch)))
              throw Error('REFUSE active PR dependency');
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            for(const sha of [p.head.sha,p.merge_commit_sha]){
              const cmp=(await github.rest.repos.compareCommits({owner,repo,base:sha,head:main})).data;
              if(cmp.behind_by!==0||cmp.merge_base_commit?.sha!==sha)
                throw Error('REFUSE not main ancestor');
            }
            const tip=async()=>{
              try{return (await github.rest.git.getRef({owner,repo,ref:'heads/'+branch})).data.object.sha;}
              catch(e){if(e.status===404)return null;throw e;}
            };
            const current=await tip();
            if(current===null){core.info('ALREADY_ABSENT');return;}
            if(current!==p.head.sha)throw Error('REFUSE head moved');
            if((await github.rest.repos.getBranch({owner,repo,branch})).data.protected)
              throw Error('REFUSE protected');
            if(await tip()!==p.head.sha)throw Error('REFUSE lease changed');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
            core.info('DELETED_VERIFIED_BEX_PR878_REF '+branch+' @ '+p.head.sha);
