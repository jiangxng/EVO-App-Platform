name: Platform CI - External Agent OAuth Profile

on:
  push:
    branches: [main]
    paths:
      - "contracts/external-agent-oauth.ts"
      - "manager/external-agent-oauth-profile.ts"
      - "tests/external-agent/oauth-resource-profile.test.mjs"
      - "package.json"
      - ".github/workflows/platform-external-agent-oauth-profile.yml"
  pull_request:
    paths:
      - "contracts/external-agent-oauth.ts"
      - "manager/external-agent-oauth-profile.ts"
      - "tests/external-agent/oauth-resource-profile.test.mjs"
      - "package.json"
      - ".github/workflows/platform-external-agent-oauth-profile.yml"

concurrency:
  group: platform-external-agent-oauth-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:external-agent:oauth-profile
