name: Cross Project CI - Trading Lite EVO PostgreSQL

on:
  pull_request:
    paths:
      - "apps/trading-lite/**"
      - "apps/trading-reference/**"
      - "contracts/evo-business-data.ts"
      - "contracts/evo-ledger-runtime-application-id.ts"
      - "manager/evo-business-data-http-adapter.ts"
      - "providers/application-runtime-binding/**"
      - "tools/certify-trading-lite-evo-postgres.mjs"
      - "tools/certify-tr01-purchase-evo-postgres.mjs"
      - "tests/protocol/tr01-evo-cross-project-certification.test.mjs"
      - ".github/workflows/cross-project-evo-business-data.yml"
  push:
    branches: [main]
    paths:
      - "apps/trading-lite/**"
      - "apps/trading-reference/**"
      - "contracts/evo-business-data.ts"
      - "contracts/evo-ledger-runtime-application-id.ts"
      - "manager/evo-business-data-http-adapter.ts"
      - "providers/application-runtime-binding/**"
      - "tools/certify-trading-lite-evo-postgres.mjs"
      - "tools/certify-tr01-purchase-evo-postgres.mjs"
      - "tests/protocol/tr01-evo-cross-project-certification.test.mjs"
      - ".github/workflows/cross-project-evo-business-data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-project-evo-business-data-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.20.0"
  DATABASE_URL: postgres://evo:evo@localhost:5432/evo
  EVO_CERTIFIED_COMMIT: 184811a1b25aa6563b03439758663f04fa4d6319
  EVO_BASE_URL: http://127.0.0.1:3000
  NODE_ENV: test
  LOG_LEVEL: silent

jobs:
  postgres-ledger-proof:
    name: Trading Lite -> EVO PostgreSQL -> Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout App Platform
        uses: actions/checkout@v5

      - name: Checkout certified EVO
        uses: actions/checkout@v5
        with:
          repository: jiangxng/EVO
          ref: ${{ env.EVO_CERTIFIED_COMMIT }}
          path: evo

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build App Platform
        run: |
          npm ci
          npm run build

      - name: Install, migrate, seed and build EVO
        working-directory: evo
        run: |
          npm ci
          npm run migrate
          npm run seed:demo
          npm run build

      - name: Start EVO API and Worker
        run: |
          set -euo pipefail
          (
            cd evo
            HOST=0.0.0.0 PORT=3000 \
              node dist/apps/api/src/main.js > /tmp/evo-api.log 2>&1 &
            echo $! > /tmp/evo-api.pid
            WORKER_POLL_INTERVAL_MS=100 \
              node dist/apps/worker/src/main.js > /tmp/evo-worker.log 2>&1 &
            echo $! > /tmp/evo-worker.pid
          )

          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS "${EVO_BASE_URL}/health/ready" > /tmp/evo-ready.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" -ne 1 ]; then
            cat /tmp/evo-api.log || true
            cat /tmp/evo-worker.log || true
            exit 1
          fi

      - name: Certify Trading Lite -> EVO -> PostgreSQL -> Ledger
        run: node tools/certify-trading-lite-evo-postgres.mjs

      - name: Certify TR-01A Purchase -> Receipt -> Ledger -> Work
        run: node tools/certify-tr01-purchase-evo-postgres.mjs

      - name: Certify TR-01A order-scoped ledger dimensions in EVO PostgreSQL
        working-directory: evo
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import pg from "pg";

          const { Client } = pg;
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const enterprise = await client.query(
              "select id from enterprise where code = $1 and status = 'ACTIVE'",
              ["EVO_DEMO"]
            );
            assert.equal(enterprise.rowCount, 1);
            const enterpriseId = enterprise.rows[0].id;

            const rows = await client.query(
              `select
                 d.code as ledger,
                 b.quantity::text as quantity,
                 b.amount::text as amount,
                 b.dimensions
               from ledger_balance b
               join ledger_definition d on d.id = b.ledger_definition_id
               join ledger_dataset ds on ds.id = b.ledger_dataset_id
               where b.enterprise_id = $1
                 and ds.kind = 'CURRENT'
                 and ds.status = 'ACTIVE'
                 and d.code = any($2::text[])
                 and b.dimensions ->> 'order_no' = $3`,
              [
                enterpriseId,
                ["pending_purchase", "payable", "inventory"],
                "TR01-PO-001"
              ]
            );

            const byLedger = new Map(rows.rows.map(row => [row.ledger, row]));
            const pending = byLedger.get("pending_purchase");
            const payable = byLedger.get("payable");
            const inventory = byLedger.get("inventory");

            assert.ok(pending, "missing pending_purchase order-scoped balance");
            assert.ok(payable, "missing payable order-scoped balance");
            assert.ok(inventory, "missing inventory order-scoped balance");

            assert.equal(Number(pending.quantity), 0);
            assert.equal(Number(payable.amount), 125);
            assert.equal(Number(inventory.quantity), 10);
            assert.equal(Number(inventory.amount), 125);

            assert.equal(inventory.dimensions.product_id, "item-tr01");
            assert.equal(inventory.dimensions.warehouse, "warehouse-tr01");
            assert.equal(inventory.dimensions.order_no, "TR01-PO-001");
            assert.equal(inventory.dimensions.supplier, "cp-tr01-supplier");

            console.log(JSON.stringify({
              status: "PASS",
              proof: "TR01A_ORDER_SCOPED_LEDGER_POSITION",
              enterpriseId,
              pendingPurchaseQuantity: Number(pending.quantity),
              payableAmount: Number(payable.amount),
              inventoryQuantity: Number(inventory.quantity),
              inventoryAmount: Number(inventory.amount),
              inventoryDimensions: inventory.dimensions
            }, null, 2));
          } finally {
            await client.end();
          }
          NODE

      - name: Stop EVO API and Worker before replay certification
        run: |
          if [ -f /tmp/evo-worker.pid ]; then kill "$(cat /tmp/evo-worker.pid)" || true; fi
          if [ -f /tmp/evo-api.pid ]; then kill "$(cat /tmp/evo-api.pid)" || true; fi
          rm -f /tmp/evo-worker.pid /tmp/evo-api.pid

      - name: Certify EVO EEL-C02 deterministic full replay
        working-directory: evo
        run: npm run validate:eel-c02-full-replay

      - name: Show EVO logs on failure
        if: failure()
        run: |
          cat /tmp/evo-api.log || true
          cat /tmp/evo-worker.log || true

      - name: Stop EVO processes
        if: always()
        run: |
          if [ -f /tmp/evo-worker.pid ]; then kill "$(cat /tmp/evo-worker.pid)" || true; fi
          if [ -f /tmp/evo-api.pid ]; then kill "$(cat /tmp/evo-api.pid)" || true; fi
