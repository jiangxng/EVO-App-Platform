name: One-time Diagram v1 Merged Ref Retirement
on:
  pull_request:
    paths:
      - "repository-hygiene/diagram-v1-merged-head-retirement-20261011.json"
      - ".github/workflows/diagram-v1-merged-branch-retirement-20261011.yml"
  push:
    branches: [main]
    paths:
      - "repository-hygiene/diagram-v1-merged-head-retirement-20261011.json"

permissions:
  contents: write
  pull-requests: read

jobs:
  audit-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact merged PR provenance; delete only after approved main merge
        uses: actions/github-script@v7
        env:
          DIAGRAM_REF_EXECUTE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          script: |
            const fs=require('node:fs');
            const {owner,repo}=context.repo;
            if(owner!=='jiangxng'||repo!=='EVO-App-Platform')throw Error('Wrong repository');
            const execute=process.env.DIAGRAM_REF_EXECUTE==='true';
            if(execute&&(context.eventName!=='push'||context.ref!=='refs/heads/main'))
              throw Error('Ref deletion is main-push only');
            const file='repository-hygiene/diagram-v1-merged-head-retirement-20261011.json';
            const m=JSON.parse(fs.readFileSync(file,'utf8'));
            if(m.schemaVersion!==1||m.scope!=='diagram-v1-sha-pinned-retirement-20261011'||
               !Array.isArray(m.records)||m.records.length<30||m.records.length>42)
              throw Error('Invalid scoped retirement manifest');
            const sha=/^[0-9a-f]{40}$/;
            const seen=new Set(),numbers=new Set();
            for(const r of m.records){
              if(!/^(accept\/diagram-|test\/diagram-v1-)[a-z0-9-]+$/.test(r.head)||
                 !sha.test(r.expectedHeadSha)||!sha.test(r.mergeCommitSha)||
                 !Number.isInteger(r.number)||seen.has(r.head)||numbers.has(r.number))
                throw Error('Malformed or duplicate record '+r.head);
              seen.add(r.head);numbers.add(r.number);
            }
            const main=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const baseline=await github.rest.repos.compareCommits({
              owner,repo,base:m.baselineMainSha,head:main});
            if(baseline.data.behind_by!==0||baseline.data.merge_base_commit?.sha!==m.baselineMainSha)
              throw Error('Main no longer descends from audit baseline');
            const getReserved=async()=>{
              const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
              const reserved=new Set(['main']);
              for(const pr of open){reserved.add(pr.base.ref);
                if(pr.head.repo?.full_name===owner+'/'+repo)reserved.add(pr.head.ref);}
              return reserved;
            };
            const reserved=await getReserved();
            for(const r of m.records){
              if(reserved.has(r.head))throw Error('Open PR uses '+r.head);
              const pr=(await github.rest.pulls.get({owner,repo,pull_number:r.number})).data;
              if(!pr.merged||pr.state!=='closed'||pr.base.ref!=='main'||
                 pr.head.repo?.full_name!==owner+'/'+repo||
                 pr.head.ref!==r.head||pr.head.sha!==r.expectedHeadSha||
                 pr.merge_commit_sha!==r.mergeCommitSha)
                throw Error('Merged PR provenance mismatch #'+r.number);
              const cmp=await github.rest.repos.compareCommits({
                owner,repo,base:r.mergeCommitSha,head:main});
              if(cmp.data.behind_by!==0||
                 cmp.data.merge_base_commit?.sha!==r.mergeCommitSha||
                 !['ahead','identical'].includes(cmp.data.status))
                throw Error('Missing main ancestor for #'+r.number);
              const ref=(await github.rest.git.getRef({owner,repo,ref:'heads/'+r.head})).data;
              if(ref.object.sha!==r.expectedHeadSha)throw Error('Ref moved '+r.head);
              const branch=(await github.rest.repos.getBranch({owner,repo,branch:r.head})).data;
              if(branch.protected)throw Error('Protected branch '+r.head);
              core.info('DIAGRAM_REF_VERIFIED '+r.head+' '+r.expectedHeadSha);
            }
            if(!execute){core.info('DIAGRAM_REF_AUDIT_ONLY '+m.records.length);return;}
            const latestReserved=await getReserved();
            for(const r of m.records)if(latestReserved.has(r.head))
              throw Error('Open PR changed during audit: '+r.head);
            for(const r of m.records){
              const now=(await github.rest.git.getRef({owner,repo,ref:'heads/'+r.head})).data;
              if(now.object.sha!==r.expectedHeadSha)throw Error('Lease rejected '+r.head);
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+r.head});
              core.info('DIAGRAM_REF_DELETED '+r.head+' '+r.expectedHeadSha);
            }
            core.info('DIAGRAM_RETIRED_COUNT='+m.records.length);
