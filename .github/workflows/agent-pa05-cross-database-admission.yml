          grep -Fq '"originalPurchaseAttentionHandlerAndSourceRouter":true' pa05-xdb.log
          grep -Fq '"hostsCannotMutateEpochOrInventory":true' pa05-xdb.log
          grep -Fq '"oldSqlBackendPrivilegeRevoked":true' pa05-xdb.log
          grep -Fq '"activeBackendTerminationFailClosed":true' pa05-xdb.log
          grep -Fq '"productionHostWired":false' pa05-xdb.log
          grep -Fq '"crossStorageAtomicInstallCertified":false' pa05-xdb.log
          grep -Fq '"actualSeparateHostProcesses":2' pa05-xdb.log
          grep -Fq '"oldReadHeldBlocksRevokeCommit":true' pa05-xdb.log
          grep -Fq '"oldEpochDeniedBothWorkers":true' pa05-xdb.log
          grep -Fq '"productionHostBusinessHandlerIntegrated":false' pa05-xdb.log
          grep -Fq '"sqlRoleSeparationCertified":false' pa05-xdb.log
          grep -Fq 'PA05_E01J_READ_INVENTORY_PG=' pa05-xdb.log
          grep -Fq '"hostInventoryPinned":true' pa05-xdb.log
          grep -Fq 'PA05_E01J_PARTITION_FAIL_CLOSED=' pa05-xdb.log
          grep -Fq '"unavailableAuthorityDenied":true' pa05-xdb.log
          grep -Fq '"runtimePartitionDuringActiveReadCertified":false' pa05-xdb.log
          grep -Fq '"physicalClusters":3' pa05-xdb.log
          grep -Fq '"productionWriteEnabled":false' pa05-xdb.log
          grep -Fq '"remoteWorkerEnforcementImplemented":false' pa05-xdb.log
          grep -Fq 'PA05_XDB_REMOTE_SQL_ADMISSION_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_GOVERNED_HANDOFF_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_OWNER_VERIFIED_SETTLEMENT_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_CENTRAL_SQL_HOST_IDENTITY_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_REMOTE_MONOTONE_FREEZE_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_HOST_PRINCIPAL_BINDING_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_TRANSACTIONAL_HOST_FENCE_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_DOMAIN_OWNER_PARTITION_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_DOMAIN_COVERAGE_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_EXTENSION_OWNER_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_PHYSICAL_SQL_FENCE_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_HOST_PERMIT_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_SQL_ROLE_DRIFT_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_HOST_PERMIT_REVOCATION_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_APPROVED_PAYLOAD_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_HOST_COMMAND_PROVENANCE_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_SQL_TRANSACTION_BINDING_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_SQL_CREDENTIAL_ROTATION_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_SQL_HOST_MTLS_PG=' pa05-xdb.log
          grep -Fq 'PA05_ACTUAL_OBJECT_SQL_HOST_TLS_REVOKE_RENEW_PG=' pa05-xdb.log
          grep -Fq '"newHandshakeRevokedCertificateDenied":true' pa05-xdb.log
          grep -Fq '"oldTlsHostPrivilegeDeniedAfterDbCutover":true' pa05-xdb.log
          grep -Fq '"renewedCertificateOriginalOwnerAndVerifierSucceeded":true' pa05-xdb.log
          grep -Fq '"originalRawOwnerDeniedEvenWithValidTicket":true' pa05-xdb.log
          grep -Fq '"privilegedTableOwnerCanStillDisableTrigger":true' pa05-xdb.log
          grep -Fq '"originalOwnerDirectBypassStillPossible":true' pa05-xdb.log
          grep -Fq '"productionWriteEnabled":false' pa05-xdb.log
          grep -Fq '"postCentralReserveFailureLeavesPendingAndNoLocalTicket":true' pa05-xdb.log
          grep -Fq '"existingBusinessPluginsAutoProtected":false' pa05-xdb.log
          grep -Fq '"hostUnticketedBeginWriteDenied":true' pa05-xdb.log
          grep -Fq '"privilegedTableOwnerCanDisableTrigger":true' pa05-xdb.log
          grep -Fq '"defaultBusinessPluginsFenced":false' pa05-xdb.log
          grep -Fq 'PA05_XDB_HOST_LEAST_PRIVILEGE_ROTATION_PG=' pa05-xdb.log
          grep -Fq '"actualD10TicketMintRejectedOnPrivilegeDrift":true' pa05-xdb.log
          grep -Fq '"newPasswordAndRevisionReattested":true' pa05-xdb.log
          grep -Fq '"realD10PreflightToReserveRaceDenied":true' pa05-xdb.log
          grep -Fq '"productionWriteEnabled":false' pa05-xdb.log
          grep -Fq '"rotatedPasswordDeniesNextRealTicket":true' pa05-xdb.log
          grep -Fq '"atomicCrossDatabaseRevocationCertified":false' pa05-xdb.log
          grep -Fq '"remotePartitionCannotClaimGlobalFreeze":true' pa05-xdb.log
          grep -Fq '"actualPa02HostSqlBeginWriteDeniedAfterFreeze":true' pa05-xdb.log
          grep -Fq '"preStagedTicketCanExecuteOnUnreachableActiveRemote":true' pa05-xdb.log
          grep -Fq '"parallelSettlementExactlyOneNewTransition":true' pa05-xdb.log
          grep -Fq '"duplicateSettlementIdempotent":true' pa05-xdb.log
          grep -Fq '"actualPa02Handoff":true' pa05-xdb.log
          grep -Fq '"sqlAdmissionRequiresStagedCentralReservation":true' pa05-xdb.log
          grep -Fq '"productionWriteEnabled":false' pa05-xdb.log
          # Node 24 test reporter uses the unicode summary rather than TAP '# skipped'.
          # Pin actual case count so a conditional PG skip cannot look like success.
          grep -Fq 'ℹ tests 23' pa05-xdb.log
          grep -Fq 'ℹ pass 23' pa05-xdb.log
          grep -Fq 'ℹ fail 0' pa05-xdb.log
          grep -Fq 'ℹ skipped 0' pa05-xdb.log
          if grep -Eq '^# skipped [1-9][0-9]*' pa05-xdb.log; then exit 1; fi
