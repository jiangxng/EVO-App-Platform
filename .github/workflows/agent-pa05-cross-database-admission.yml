permissions:
  contents: read
jobs:
  cross-database-reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      authority:
        image: postgres:18
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: proof
          POSTGRES_DB: pa05_authority
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proof -d pa05_authority"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      worker_a:
        image: postgres:18
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: proof
          POSTGRES_DB: pa05_worker_a
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U proof -d pa05_worker_a"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      worker_b:
        image: postgres:18
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: proof
          POSTGRES_DB: pa05_worker_b
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U proof -d pa05_worker_b"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      PA05_XDB_AUTHORITY_DATABASE_URL: postgres://proof:proof@127.0.0.1:5432/pa05_authority
      PA05_XDB_WORKER_A_DATABASE_URL: postgres://proof:proof@127.0.0.1:5433/pa05_worker_a
      PA05_XDB_WORKER_B_DATABASE_URL: postgres://proof:proof@127.0.0.1:5434/pa05_worker_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Configure ephemeral worker A PostgreSQL18 Host client certificate authentication
        run: bash scripts/ci/pa05-host-mtls-setup.sh ${{ job.services.worker_a.id }}
      - name: Three PostgreSQL18 clusters, central lock and remote Worker uncertainty
        shell: bash
        run: |
          set -euo pipefail
          # Serial file runners prevent independent PG18 suites from exhausting
          # the same ephemeral central authority connection pool. Assertions,
          # 20-second per-IPC limits and the strict 22/22 zero-skip gate remain.
          node --test --test-concurrency=1 tests/agent-line/pa05-cross-database-admission-pg.test.mjs tests/agent-line/pa05-cross-database-remote-sql-pg.test.mjs tests/agent-line/pa05-cross-database-governed-handoff-pg.test.mjs tests/agent-line/pa05-cross-database-host-sql-identity-pg.test.mjs tests/agent-line/pa05-cross-database-remote-freeze-pg.test.mjs tests/agent-line/pa05-cross-database-host-principal-pg.test.mjs tests/agent-line/pa05-cross-database-transaction-principal-pg.test.mjs tests/agent-line/pa05-cross-database-domain-owner-partition-pg.test.mjs tests/agent-line/pa05-cross-database-domain-coverage-pg.test.mjs tests/agent-line/pa05-actual-object-extension-owner-pg.test.mjs tests/agent-line/pa05-object-extension-physical-sql-fence-pg.test.mjs tests/agent-line/pa05-object-extension-host-permit-pg.test.mjs tests/agent-line/pa05-e01j-shared-read-owner-pg.test.mjs tests/agent-line/pa05-e01j2-authenticated-read-handler-pg.test.mjs tests/agent-line/pa05-e01j4d-actual-host-http-pg.test.mjs | tee pa05-xdb.log
          grep -Fq 'PA05_XDB_CENTRAL_RESERVATION_PG=' pa05-xdb.log
          grep -Fq 'PA05_E01J_SHARED_READ_OWNER_PG=' pa05-xdb.log
          grep -Fq 'PA05_E01J2_AUTHENTICATED_HANDLER_PG=' pa05-xdb.log
          grep -Fq 'PA05_E01J2_AUTHORITY_UNAVAILABLE=' pa05-xdb.log
          grep -Fq 'PA05_E01J3_INFLIGHT_TCP_PARTITION_PG=' pa05-xdb.log
          grep -Fq 'PA05_E01J4_PERSISTED_MULTIWORKER_REATTEST_PG=' pa05-xdb.log
          grep -Fq 'PA05_E01J4B_CRASH_RECOVER_LIFECYCLE_PG=' pa05-xdb.log
          grep -Fq 'PA05_E01J4C_HOST_COMPOSED_LIFECYCLE_PG=' pa05-xdb.log
          grep -Fq 'PA05_E01J4D_ACTUAL_HTTP_LIFECYCLE_PG=' pa05-xdb.log
          grep -Fq 'PA05_E01J4E_LEAST_PRIVILEGE_FUNCTION_PG=' pa05-xdb.log
          grep -Fq '"sqlHostRoleNoRawUpdate":true' pa05-xdb.log
          grep -Fq '"ordinaryWorkerFunctionDenied":true' pa05-xdb.log
          grep -Fq '"forgedHostIdentityAndGucDenied":true' pa05-xdb.log
          grep -Fq '"productionDatabaseProvisioned":false' pa05-xdb.log
          grep -Fq '"actualNodeHostHttpAndAction":true' pa05-xdb.log
          grep -Fq '"directDisableSqlFirst":true' pa05-xdb.log
          grep -Fq '"actionUninstallSqlFirst":true' pa05-xdb.log
          grep -Fq '"missingCentralAuthorityFailsClosed":true' pa05-xdb.log
          grep -Fq '"ordinaryWorkerCannotMutateCentralApproval":true' pa05-xdb.log
          grep -Fq '"fullDistributedCrossStoreAtomicity":false' pa05-xdb.log
          grep -Fq '"privilegedOperatorRequired":true' pa05-xdb.log
          grep -Fq '"centralOutageBlocksLocalMutation":true' pa05-xdb.log
          grep -Fq '"completeOutageLeavesDurableRepair":true' pa05-xdb.log
          grep -Fq '"reinstallWithoutHostReattestationDenied":true' pa05-xdb.log
          grep -Fq '"actualProductionServerRouteWired":false' pa05-xdb.log
          grep -Fq '"centralCutAndIntentSameSqlTransaction":true' pa05-xdb.log
          grep -Fq '"revokeWaitedForInFlightRead":true' pa05-xdb.log
          grep -Fq '"uninstalledPackageNotAutoRestored":true' pa05-xdb.log
          grep -Fq '"repairDurableAcrossThreeWorkerCrashes":true' pa05-xdb.log
          grep -Fq '"reinstallWithoutReattestationDenied":true' pa05-xdb.log
          grep -Fq '"productionCrossStoreAtomicityCertified":false' pa05-xdb.log
          grep -Fq '"crashedWorkerRestoredLocallyActive":true' pa05-xdb.log
          grep -Fq '"globalRecertificationDoesNotAutoApproveWorkers":true' pa05-xdb.log
          grep -Fq '"workerCannotForgeHostReattestation":true' pa05-xdb.log
          grep -Fq '"reattestedHostReadPasses":true' pa05-xdb.log
          grep -Fq '"localJsonPostgresAtomicityCertified":false' pa05-xdb.log
