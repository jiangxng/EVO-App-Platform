name: PA05 - Cross-database reservation admission (isolated)
on:
  pull_request:
    paths:
      - "manager/pa05-cross-database-admission.ts"
      - "manager/pa05-cross-database-remote-sql-admission.ts"
      - "manager/pa05-cross-database-freeze.ts"
      - "manager/pa05-cross-database-host-principal.ts"
      - "manager/pa05-cross-database-owner-settlement.ts"
      - "agents/enterprise-agent/pa02b-governed-owner-write-handoff.ts"
      - "tests/agent-line/pa05-cross-database-admission-pg.test.mjs"
      - "tests/agent-line/pa05-cross-database-remote-sql-pg.test.mjs"
      - "tests/agent-line/pa05-cross-database-governed-handoff-pg.test.mjs"
      - "tests/agent-line/pa05-cross-database-host-sql-identity-pg.test.mjs"
      - "tests/agent-line/pa05-cross-database-remote-freeze-pg.test.mjs"
      - "tests/agent-line/pa05-cross-database-host-principal-pg.test.mjs"
      - "tests/agent-line/pa05-cross-database-transaction-principal-pg.test.mjs"
      - "docs/agent-line/PA05-CERTIFICATION-BASELINE-20261015.md"
      - ".github/workflows/agent-pa05-cross-database-admission.yml"
  push:
    branches: [main]
    paths:
      - "manager/pa05-cross-database-admission.ts"
      - "manager/pa05-cross-database-remote-sql-admission.ts"
      - "manager/pa05-cross-database-freeze.ts"
      - "tests/agent-line/pa05-cross-database-admission-pg.test.mjs"
      - "tests/agent-line/pa05-cross-database-remote-freeze-pg.test.mjs"
      - ".github/workflows/agent-pa05-cross-database-admission.yml"
permissions:
  contents: read
jobs:
  cross-database-reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      authority:
        image: postgres:18
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: proof
          POSTGRES_DB: pa05_authority
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proof -d pa05_authority"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      worker_a:
        image: postgres:18
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: proof
          POSTGRES_DB: pa05_worker_a
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U proof -d pa05_worker_a"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      worker_b:
        image: postgres:18
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: proof
          POSTGRES_DB: pa05_worker_b
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U proof -d pa05_worker_b"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      PA05_XDB_AUTHORITY_DATABASE_URL: postgres://proof:proof@127.0.0.1:5432/pa05_authority
      PA05_XDB_WORKER_A_DATABASE_URL: postgres://proof:proof@127.0.0.1:5433/pa05_worker_a
      PA05_XDB_WORKER_B_DATABASE_URL: postgres://proof:proof@127.0.0.1:5434/pa05_worker_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Three PostgreSQL18 clusters, central lock and remote Worker uncertainty
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/agent-line/pa05-cross-database-admission-pg.test.mjs tests/agent-line/pa05-cross-database-remote-sql-pg.test.mjs tests/agent-line/pa05-cross-database-governed-handoff-pg.test.mjs tests/agent-line/pa05-cross-database-host-sql-identity-pg.test.mjs tests/agent-line/pa05-cross-database-remote-freeze-pg.test.mjs tests/agent-line/pa05-cross-database-host-principal-pg.test.mjs tests/agent-line/pa05-cross-database-transaction-principal-pg.test.mjs | tee pa05-xdb.log
          grep -Fq 'PA05_XDB_CENTRAL_RESERVATION_PG=' pa05-xdb.log
          grep -Fq '"physicalClusters":3' pa05-xdb.log
          grep -Fq '"productionWriteEnabled":false' pa05-xdb.log
          grep -Fq '"remoteWorkerEnforcementImplemented":false' pa05-xdb.log
          grep -Fq 'PA05_XDB_REMOTE_SQL_ADMISSION_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_GOVERNED_HANDOFF_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_OWNER_VERIFIED_SETTLEMENT_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_CENTRAL_SQL_HOST_IDENTITY_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_REMOTE_MONOTONE_FREEZE_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_HOST_PRINCIPAL_BINDING_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_TRANSACTIONAL_HOST_FENCE_PG=' pa05-xdb.log
          grep -Fq 'PA05_XDB_HOST_LEAST_PRIVILEGE_ROTATION_PG=' pa05-xdb.log
          grep -Fq '"actualD10TicketMintRejectedOnPrivilegeDrift":true' pa05-xdb.log
          grep -Fq '"newPasswordAndRevisionReattested":true' pa05-xdb.log
          grep -Fq '"realD10PreflightToReserveRaceDenied":true' pa05-xdb.log
          grep -Fq '"productionWriteEnabled":false' pa05-xdb.log
          grep -Fq '"rotatedPasswordDeniesNextRealTicket":true' pa05-xdb.log
          grep -Fq '"atomicCrossDatabaseRevocationCertified":false' pa05-xdb.log
          grep -Fq '"remotePartitionCannotClaimGlobalFreeze":true' pa05-xdb.log
          grep -Fq '"actualPa02HostSqlBeginWriteDeniedAfterFreeze":true' pa05-xdb.log
          grep -Fq '"preStagedTicketCanExecuteOnUnreachableActiveRemote":true' pa05-xdb.log
          grep -Fq '"parallelSettlementExactlyOneNewTransition":true' pa05-xdb.log
          grep -Fq '"duplicateSettlementIdempotent":true' pa05-xdb.log
          grep -Fq '"actualPa02Handoff":true' pa05-xdb.log
          grep -Fq '"sqlAdmissionRequiresStagedCentralReservation":true' pa05-xdb.log
          grep -Fq '"productionWriteEnabled":false' pa05-xdb.log
          if grep -Eq '^# skipped [1-9][0-9]*' pa05-xdb.log; then exit 1; fi
      - name: Preserve isolated non-production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa05-xdb-reservation-pg-evidence
          path: pa05-xdb.log
          retention-days: 14
          if-no-files-found: warn
