name: Lightweight Host Architecture
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lightweight-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lightweight-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Guard regression tests
        run: node --test tests/protocol/lightweight-host-guard.test.mjs tests/protocol/web-asset-graph-audit.test.mjs
      - name: Check eager dependency ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git worktree add --detach "$RUNNER_TEMP/lightweight-base" "$BASE_SHA"
            LIGHTWEIGHT_HOST_BASE_ROOT="$RUNNER_TEMP/lightweight-base" node tools/lightweight-host-validate.mjs --base "$BASE_SHA"
          else
            node tools/lightweight-host-validate.mjs
          fi
      - run: npm run build
      - name: Inactive plugin and lazy action behavior
        run: node --test tests/protocol/llm-credential-fetch.test.mjs tests/integration/llm-credential-persistence-host.test.mjs tests/protocol/llm-provider-resource-boundary.test.mjs tests/protocol/provider-health-resolution.test.mjs tests/protocol/eog-retained-imports.test.mjs tests/integration/eog-sop-command-lazy-host.test.mjs tests/integration/eog-editor-entries-lazy-host.test.mjs tests/protocol/enterprise-operating-graph-host-v0-1.test.mjs tests/protocol/eog-lazy-selection-inspection.test.mjs tests/protocol/eog-current-editor-crop-lazy.test.mjs tests/integration/personal-agent-current-projection.test.mjs tests/protocol/eog-registration-resource-boundary.test.mjs tests/protocol/eog-view-state-loading.test.mjs tests/integration/eog-observatory-actions-lazy-host.test.mjs tests/integration/eog-observatory-surfaces-lazy-host.test.mjs tests/integration/eog-spatial-lazy-host.test.mjs tests/integration/eog-3d-lazy-host.test.mjs tests/protocol/eog-service-on-use.test.mjs tests/integration/eog-startup-compatibility-host.test.mjs tests/protocol/context-memory-scheduler-file-lease.test.mjs tests/integration/context-memory-scheduler-http.test.mjs tests/protocol/context-memory-scheduler-demand.test.mjs tests/integration/context-memory-scheduler-demand-host.test.mjs tests/protocol/context-memory-scheduler-stop.test.mjs tests/protocol/web-asset-manifest.test.mjs tests/protocol/web-asset-archive.test.mjs tests/integration/web-asset-manifest-host.test.mjs tests/protocol/bex01-in-context-resume.test.mjs tests/protocol/data-import-action-target.test.mjs tests/protocol/data-import-runtime-lazy.test.mjs tests/integration/object-extension-lazy-host.test.mjs tests/protocol/object-extension-runtime-lazy.test.mjs tests/protocol/object-extension-consumer-boundary.test.mjs tests/protocol/responsibility-runtime-lazy.test.mjs tests/protocol/counterparty-runtime-lazy.test.mjs tests/protocol/object-extension-import-lazy.test.mjs tests/configurator/lazy-runtime.test.mjs tests/integration/ledger-lazy-host.test.mjs tests/protocol/plugin-resource-lazy-loading.test.mjs tests/actions/lazy-handler.test.mjs tests/protocol/startup-defaults.test.mjs tests/protocol/lazy-provider-runtime.test.mjs tests/protocol/provider-lifecycle-administration.test.mjs tests/protocol/provider-lifecycle-page.test.mjs tests/protocol/evo-runtime-revision-bridge.test.mjs tests/integration/evo-runtime-revision-resources.test.mjs tests/integration/startup-defaults-restart.test.mjs
      - name: Browser asset graph observation
        run: node tools/web-asset-graph-audit.mjs artifacts/web-asset-graph.json
      - name: Isolated startup resource baseline
        run: node tools/lightweight-host-benchmark.mjs artifacts/lightweight-host-baseline.json
      - name: Isolated installed-disabled module and resource audit
        run: node tools/plugin-loading-audit.mjs artifacts/plugin-loading-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: lightweight-host-baseline
          path: |
            artifacts/lightweight-host-baseline.json
            artifacts/plugin-loading-audit.json
            artifacts/web-asset-graph.json
            dist/web-asset-manifest.json
          retention-days: 14

