name: Retire remaining preserved 2D PR branch chain
on:
  push:
    branches: [main]
    paths:
      - "docs/architecture/DIAGRAM-B9-FINAL-CHAIN-CLOSEOUT-20261011.json"
      - ".github/workflows/diagram-b9-final-closeout.yml"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  delete-final-2d-refs:
    if: github.repository == 'jiangxng/EVO-App-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check archived code and no open dependents before deleting five refs
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const read=async path=>{
              const result=await github.rest.repos.getContent({owner,repo,path,ref:context.sha});
              if(Array.isArray(result.data)||result.data.type!=="file")throw Error("Missing provenance "+path);
              return JSON.parse(Buffer.from(result.data.content,"base64").toString("utf8"));
            };
            const m=await read("docs/architecture/DIAGRAM-B9-FINAL-CHAIN-CLOSEOUT-20261011.json");
            const b9=await read("docs/architecture/DIAGRAM-B9-DRAFT-CONSOLIDATED-CATALOG-20261011.json");
            if(m.kind!=="CLOSEOUT_LAST_FIVE_2D_PROVENANCE_PRS"||
              m.priorB9ArchivePR!==705||m.priorB9RetirementPR!==706||
              b9.legacyDraftPRs?.length!==54||b9.archivedEntries?.length!==92||
              m.closedHistoryPRs?.length!==5||m.formalCommercialAcceptance?.signed!==0)
                throw Error("Historical catalog mismatch");
            for(const n of [705,706]){
              const {data:p}=await github.rest.pulls.get({owner,repo,pull_number:n});
              if(!p.merged_at)throw Error("Prerequisite archive not merged: #"+n);
            }
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:"open",per_page:100});
            const expect=[537,547,549,550,552];
            const rows=[];
            for(let i=0;i<5;i++){
              const e=m.closedHistoryPRs[i];
              if(e.number!==expect[i]||!e.cleanupEligible||e.merged||
                !/^[a-f0-9]{40}$/.test(e.headSha))throw Error("Unexpected PR row "+e.number);
              const {data:p}=await github.rest.pulls.get({owner,repo,pull_number:e.number});
              if(p.state!=="closed"||p.merged_at||p.head?.repo?.full_name!==owner+"/"+repo||
                p.head.ref!==e.headRef||p.head.sha!==e.headSha)
                throw Error("Source PR changed "+e.number);
              if(open.some(pr=>pr.base?.ref===e.headRef))throw Error("Open PR still requires "+e.headRef);
              const ref=await github.rest.git.getRef({owner,repo,ref:"heads/"+e.headRef});
              if(ref.data.object.sha!==e.headSha)throw Error("Source ref changed "+e.headRef);
              rows.push(e);
            }
            if(rows.length!==5)throw Error("Preflight incomplete");
            const archive=await github.rest.repos.getContent({owner,repo,path:m.onlyDistinctUnarchivedBlob.archivePath,ref:context.sha});
            const bytes=Buffer.from(archive.data.content,"base64");
            const sha=require("crypto").createHash("sha1").update("blob "+bytes.length+"\0").update(bytes).digest("hex");
            if(sha!==m.onlyDistinctUnarchivedBlob.blob)throw Error("Unarchived historical research blob changed");
            for(const e of rows){
              const ref=await github.rest.git.getRef({owner,repo,ref:"heads/"+e.headRef});
              if(ref.data.object.sha!==e.headSha)throw Error("Concurrent change "+e.headRef);
              await github.rest.git.deleteRef({owner,repo,ref:"heads/"+e.headRef});
              core.info("Deleted historical 2D PR #"+e.number+" head="+e.headRef);
            }
            core.info("All 5 closed non-active 2D refs safely retired.");
