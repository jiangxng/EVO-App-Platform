name: IT-01E Open Food Facts Item RVC

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/it01-item-open-food-facts-rvc.yml
      - tools/item-rvc-open-food-facts.mjs
      - tests/protocol/it01-item-open-food-facts-rvc.test.mjs

permissions:
  contents: read

jobs:
  item-open-food-facts-rvc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run build --silent

      - name: Install bounded Parquet reader
        run: python -m pip install --disable-pip-version-check "duckdb==1.4.1"

      - name: Extract auditable 20k Open Food Facts sample
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import datetime
          import hashlib
          import json
          import urllib.request
          import duckdb

          dataset = "openfoodfacts/product-database"
          api_url = "https://huggingface.co/api/datasets/" + dataset
          request = urllib.request.Request(
              api_url,
              headers={"User-Agent": "EVO-IT01E-RVC/0.1"}
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              metadata = json.load(response)

          source_sha = metadata["sha"]
          resolved_url = (
              "https://huggingface.co/datasets/"
              + dataset
              + "/resolve/"
              + source_sha
              + "/food.parquet"
          )

          con = duckdb.connect()
          con.execute("INSTALL httpfs")
          con.execute("LOAD httpfs")
          quoted_url = resolved_url.replace("'", "''")
          schema_rows = con.execute(
              "DESCRIBE SELECT * FROM read_parquet('" + quoted_url + "')"
          ).fetchall()
          columns = {row[0] for row in schema_rows}
          if "code" not in columns:
              raise RuntimeError("IT01E_OFF_CODE_COLUMN_MISSING")

          wanted = [
              ("code", "code"),
              ("product_name", "product_name"),
              ("quantity", "quantity"),
              ("brands", "brands"),
              ("categories_tags", "categories_tags"),
              ("countries_tags", "countries_tags"),
          ]
          select_parts = []
          for source, alias in wanted:
              if source in columns:
                  select_parts.append(
                      'CAST("' + source + '" AS VARCHAR) AS "' + alias + '"'
                  )
              else:
                  select_parts.append("'' AS \"" + alias + "\"")

          sql = (
              "COPY (SELECT "
              + ", ".join(select_parts)
              + " FROM read_parquet('"
              + quoted_url
              + "') WHERE TRIM(CAST(code AS VARCHAR)) <> '' LIMIT 20000) "
              + "TO '/tmp/off-item-rvc.csv' (HEADER, DELIMITER ',', QUOTE '\"')"
          )
          con.execute(sql)

          with open("/tmp/off-item-rvc.csv", "rb") as handle:
              digest = hashlib.sha256(handle.read()).hexdigest()

          retrieved_at = datetime.datetime.now(
              datetime.timezone.utc
          ).isoformat().replace("+00:00", "Z")
          manifest = {
              "contractVersion": "0.1.0",
              "sourceId": "open-food-facts-product-database",
              "sourceUrl": (
                  "https://huggingface.co/datasets/"
                  "openfoodfacts/product-database"
              ),
              "resolvedDataUrl": resolved_url,
              "retrievedAt": retrieved_at,
              "sourceVersion": source_sha,
              "license": "Open Database License (ODbL) 1.0",
              "attributionRequirements": (
                  "Derived from Open Food Facts product data; retain Open Food Facts attribution and ODbL obligations."
              ),
              "redistributionConstraints": (
                  "Raw sample is ephemeral CI input and is not committed or uploaded; only derived manifest/report evidence is retained."
              ),
              "adapterVersion": "it01e-off-rvc-v0.1",
              "sampling": {
                  "method": "FIRST_N_NONEMPTY_CODE",
                  "limit": 20000
              },
              "importPressure": {
                  "limit": 1000
              },
              "fieldMap": {
                  "code": "code",
                  "productName": "product_name",
                  "quantity": "quantity",
                  "brands": "brands",
                  "categories": "categories_tags",
                  "countries": "countries_tags"
              },
              "sampleContentDigest": "sha256:" + digest
          }
          with open("/tmp/off-item-rvc.manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")

          print(json.dumps({
              "sourceVersion": source_sha,
              "availableRequestedColumns": [
                  name for name, _ in wanted if name in columns
              ],
              "sampleContentDigest": manifest["sampleContentDigest"]
          }, indent=2))
          PY

      - name: Run real-world Item RVC and generic import pressure
        shell: bash
        run: |
          set -euo pipefail
          node tools/item-rvc-open-food-facts.mjs             --manifest /tmp/off-item-rvc.manifest.json             --input /tmp/off-item-rvc.csv             --report /tmp/off-item-rvc.report.json

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(
            readFileSync("/tmp/off-item-rvc.report.json", "utf8")
          );

          if (report.rawEvidence.totalRows !== 20_000) {
            throw new Error(
              "IT01E_OFF_ROW_COUNT_INVALID: " + report.rawEvidence.totalRows
            );
          }
          if (report.rawEvidence.validGtinChecksumCandidates < 1) {
            throw new Error("IT01E_OFF_NO_VALID_GTIN_EVIDENCE");
          }
          if (report.rawEvidence.quantityRowsWithRec20Mapping < 1) {
            throw new Error("IT01E_OFF_NO_REC20_QUANTITY_EVIDENCE");
          }
          if (report.importPressure.requestedRows !== 1_000) {
            throw new Error(
              "IT01E_OFF_IMPORT_SAMPLE_INVALID: "
              + report.importPressure.requestedRows
            );
          }
          if (
            report.importPressure.dryRunState !== "DRY_RUN_READY"
            || report.importPressure.commitState !== "COMMITTED"
            || report.importPressure.committedRows !== 1_000
            || report.importPressure.itemResources !== 1_000
            || report.importPressure.extensionValueSets !== 1_000
          ) {
            throw new Error(
              "IT01E_OFF_GENERIC_IMPORT_PRESSURE_FAILED: "
              + JSON.stringify(report.importPressure)
            );
          }
          if (
            report.semanticBoundary.sourceCodeIsEnterpriseItemIdentity !== false
            || report.semanticBoundary.gtinIsUniversalItemPrimaryKey !== false
            || report.semanticBoundary.packageQuantityDefinesEnterpriseBaseUom !== false
          ) {
            throw new Error("IT01E_OFF_SEMANTIC_BOUNDARY_REGRESSION");
          }

          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload derived RVC evidence only
        uses: actions/upload-artifact@v4
        with:
          name: it01e-open-food-facts-item-rvc
          path: |
            /tmp/off-item-rvc.manifest.json
            /tmp/off-item-rvc.report.json
          retention-days: 7
