name: Agent PA-04 C06 Memory Reference Disclosure
on:
  pull_request:
    paths:
      - "agents/enterprise-agent/pa04-memory-reference-disclosure.ts"
      - "agents/enterprise-agent/host-tool-catalog.ts"
      - "tests/agent-line/pa04-c06-memory-reference-disclosure.test.mjs"
      - ".github/workflows/agent-pa04-c06-memory-reference-disclosure.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-memory-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/agent-line/pa04-c06-memory-reference-disclosure.test.mjs tests/agent/enterprise-agent.test.mjs
