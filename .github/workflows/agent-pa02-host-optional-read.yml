name: Agent PA-02 Host Optional PostgreSQL Read
on:
  pull_request:
    paths:
      - "manager/agent-async-run-host-mode.ts"
      - "manager/server.ts"
      - "tests/agent-line/pa02-host-optional-postgres-read.test.mjs"
      - ".github/workflows/agent-pa02-host-optional-read.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optional-host-read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentproof
          POSTGRES_PASSWORD: agentproof
          POSTGRES_DB: agentproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentproof -d agentproof"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      PA02A_PROOF_DATABASE_URL: postgres://agentproof:agentproof@127.0.0.1:5432/agentproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/agent-line/pa02-host-optional-postgres-read.test.mjs tests/agent-line/pa02-host-run-action-pg-e2e.test.mjs
