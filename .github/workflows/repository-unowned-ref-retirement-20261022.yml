name: Repository inactive refs audit and archival (2026-10-22)
on:
  pull_request:
    paths:
      - .github/workflows/repository-unowned-ref-retirement-20261022.yml
      - repository-hygiene/unowned-refs-20261022.json
      - tools/unowned-ref-retirement-20261022.cjs
      - tests/protocol/unowned-ref-retirement-20261022.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/repository-unowned-ref-retirement-20261022.yml
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: repository-unowned-ref-retirement-20261022-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: node --test tests/protocol/unowned-ref-retirement-20261022.test.mjs
      - uses: actions/github-script@v7
        with:
          script: |
            const {retire}=require('./tools/unowned-ref-retirement-20261022.cjs');
            await retire({github,context,core});
  archive-and-retire:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: node --test tests/protocol/unowned-ref-retirement-20261022.test.mjs
      - uses: actions/github-script@v7
        with:
          script: |
            const {retire}=require('./tools/unowned-ref-retirement-20261022.cjs');
            await retire({github,context,core});
