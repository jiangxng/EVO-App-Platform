name: Branch Hygiene

on:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      execute:
        description: "Delete only SHA-pinned, verified retired branches (default audit only)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  safe-retired-branch-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicit retirement manifest and optionally prune
        uses: actions/github-script@v7
        env:
          EXECUTE: ${{ inputs.execute }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository?.default_branch ?? 'main';
            const execute = process.env.EXECUTE === 'true';
            const manifestResponse = await github.rest.repos.getContent({
              owner, repo, path: 'repository-hygiene/retired-branches.json', ref: defaultBranch
            });
            if (Array.isArray(manifestResponse.data) || manifestResponse.data.type !== 'file') {
              throw new Error('Retirement manifest must be a file');
            }
            const manifest = JSON.parse(Buffer.from(manifestResponse.data.content, 'base64').toString('utf8'));
            // A single bounded query protects heads AND bases of all currently open PRs.
            // Do not silently proceed when the result exceeds the bounded set.
            const open = await github.rest.pulls.list({owner, repo, state: 'open', per_page: 100});
            if (open.data.length === 100) throw new Error('Open PR set may exceed 100; fail closed');
            const reserved = new Set([defaultBranch]);
            for (const pr of open.data) {
              if (pr.head?.repo?.full_name === `${owner}/${repo}`) reserved.add(pr.head.ref);
              reserved.add(pr.base.ref);
            }
            const restricted = /(^|\/)(agent|eog|2d|diagram|projection)(\/|-|$)|personal-agent|external-agent|sop-designer/i;
            const entries = manifest.retiredBranches ?? [];
            const seen = new Set();
            for (const item of entries) {
              const name = item?.name;
              const expected = item?.expectedHeadSha;
              if (typeof name !== 'string' || !name || seen.has(name)) {
                throw new Error('Duplicate or invalid retirement entry');
              }
              seen.add(name);
              // Legacy entries without an exact 40-digit pin are never deletion authorization.
              if (typeof expected !== 'string' || !/^[a-f0-9]{40}$/i.test(expected)) {
                core.info(`SKIP_UNPINNED ${name}`);
                continue;
              }
              if (reserved.has(name) || restricted.test(name)) {
                core.info(`SKIP_PROTECTED ${name}`);
                continue;
              }
              let ref;
              try {
                ref = await github.rest.git.getRef({owner, repo, ref: `heads/${name}`});
              } catch (error) {
                if (error.status === 404) {core.info(`ALREADY_ABSENT ${name}`); continue;}
                throw error;
              }
              if (ref.data.object.sha !== expected) {
                core.warning(`SKIP_MOVED ${name}`);
                continue;
              }
              // GitHub compare(base=head, head=main): behind_by=0 means source is
              // an ancestor of main; divergent branches must not be retired.
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: expected, head: defaultBranch
              });
              if (comparison.data.behind_by !== 0 || comparison.data.status === 'diverged') {
                core.info(`SKIP_NOT_MERGED ${name}`);
                continue;
              }
              if (!execute) {core.info(`AUDIT_ELIGIBLE ${name} @ ${expected}`); continue;}
              // Re-read immediately before deletion; any movement fails closed.
              const latest = await github.rest.git.getRef({owner, repo, ref: `heads/${name}`});
              if (latest.data.object.sha !== expected) {core.warning(`SKIP_RACED ${name}`); continue;}
              await github.rest.git.deleteRef({owner, repo, ref: `heads/${name}`});
              core.info(`DELETED ${name} @ ${expected}`);
            }
            core.info(`Retirement ${execute ? 'execute' : 'audit'} complete`);


  audit-agent-branch-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Report orphaned Agent branches and unfinished integrations (audit only)
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const fullName=owner+'/'+repo;
            const agentName=name=>/^(?:agent\/|docs\/agent-|docs\/personal-agent|docs\/external-agent)/i.test(name);
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const main=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            const report={mainSha:main.data.commit.sha,agentBranches:[],orphanOver24h:[],duplicatePA02:[]};
            for(const branch of branches.filter(b=>agentName(b.name))){
              const tip=branch.commit.sha;
              const prs=open.filter(p=>p.head.repo?.full_name===fullName&&p.head.ref===branch.name);
              const cmp=(await github.rest.repos.compareCommits({
                owner,repo,base:main.data.commit.sha,head:tip
              })).data;
              const unique=cmp.ahead_by||0;
              const commit=(await github.rest.repos.getCommit({owner,repo,ref:tip})).data;
              const committedAt=commit.commit.committer?.date||commit.commit.author?.date;
              const ageHours=(Date.now()-new Date(committedAt).getTime())/3600000;
              const item={branch:branch.name,sha:tip,aheadBy:unique,behindBy:cmp.behind_by,
                openPRs:prs.map(p=>p.number),ageHours:Math.round(ageHours),protected:branch.protected};
              report.agentBranches.push(item);
              if(unique>0&&!prs.length&&ageHours>24)report.orphanOver24h.push(item);
            }
            const pa02=report.agentBranches.filter(x=>x.branch.startsWith('agent/pa02-')&&x.aheadBy>0);
            if(pa02.length>1)report.duplicatePA02=pa02.map(x=>x.branch);
            core.info(JSON.stringify(report,null,2));
            await core.summary.addHeading('Agent Branch Hygiene — no deletion')
              .addRaw('All Agent refs: '+report.agentBranches.length+
                '; orphan unique-commit refs older than 24h: '+report.orphanOver24h.length+
                '; concurrent PA-02 refs: '+pa02.length+'\n')
              .addCodeBlock(JSON.stringify(report,null,2),'json').write();
            if(report.duplicatePA02.length)
              core.warning('Multiple PA-02 work branches: reconcile with the existing PR, do not create another.');
            if(report.orphanOver24h.length){
              if(context.eventName==='schedule')
                core.setFailed('Unowned Agent changes older than 24 hours; reconcile, do not delete blindly.');
              else core.warning('Unowned Agent changes older than 24 hours; manual audit only.');
            }

  retire-merged-agent-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete only exact merged and ancestry-verified Agent PR branch
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const p=context.payload.pull_request;
            const name=p.head?.ref;
            const fullName=owner+'/'+repo;
            const agentName=typeof name==='string'&&
              /^(?:agent\/|docs\/agent-|docs\/personal-agent|docs\/external-agent)/i.test(name);
            if(!p.merged||p.base?.ref!=='main'||p.head?.repo?.full_name!==fullName||
               !agentName||name==='main'){
              core.info('SKIP_NOT_APPLICABLE'); return;
            }
            const expected=p.head.sha;
            const current=async()=> {
              try {return (await github.rest.git.getRef({owner,repo,ref:'heads/'+name})).data.object.sha;}
              catch(e){if(e.status===404)return null;throw e;}
            };
            if(await current()!==expected){
              core.info('SKIP_HEAD_CHANGED_OR_ABSENT '+name);return;
            }
            const b=(await github.rest.repos.getBranch({owner,repo,branch:name})).data;
            if(b.protected){core.info('SKIP_PROTECTED '+name);return;}
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            if(open.some(pr=>pr.base.ref===name||
                 (pr.head.repo?.full_name===fullName&&pr.head.ref===name))){
              core.info('SKIP_ACTIVE_REFERENCE '+name);return;
            }
            const main=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            const cmp=(await github.rest.repos.compareCommits({owner,repo,base:expected,head:main})).data;
            if(cmp.behind_by!==0||cmp.merge_base_commit?.sha!==expected){
              core.warning('SKIP_NON_ANCESTOR '+name+
                '; squash/subsumed changes need separate human-verified retirement');
              return;
            }
            if(await current()!==expected){
              core.info('SKIP_RACE '+name);return;
            }
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+name});
            core.info('DELETED_VERIFIED_MERGED_AGENT_BRANCH '+name+' @ '+expected);
