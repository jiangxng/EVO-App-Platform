name: Agent CI - Thread-backed Turns P1.7B

on:
  push:
    branches: [main]
    paths:
      - "contracts/conversation-thread.ts"
      - "contracts/agent-assistance.ts"
      - "contracts/agent-run.ts"
      - "agents/enterprise-agent/assistance-request.ts"
      - "manager/conversation-thread-store.ts"
      - "agents/enterprise-agent/thread-action-handlers.ts"
      - "agents/enterprise-agent/thread-turn-action-handlers.ts"
      - "agents/enterprise-agent/run-runtime.ts"
      - "manager/server.ts"
      - "tests/protocol/conversation-thread-p1-7a.test.mjs"
      - "tests/integration/p1-7b-thread-backed-turn.test.mjs"
      - "package.json"
      - ".github/workflows/agent-conversation-thread-p1-7b.yml"
  pull_request:
    paths:
      - "contracts/conversation-thread.ts"
      - "contracts/agent-assistance.ts"
      - "contracts/agent-run.ts"
      - "agents/enterprise-agent/assistance-request.ts"
      - "manager/conversation-thread-store.ts"
      - "agents/enterprise-agent/thread-action-handlers.ts"
      - "agents/enterprise-agent/thread-turn-action-handlers.ts"
      - "agents/enterprise-agent/run-runtime.ts"
      - "manager/server.ts"
      - "tests/protocol/conversation-thread-p1-7a.test.mjs"
      - "tests/integration/p1-7b-thread-backed-turn.test.mjs"
      - "package.json"
      - ".github/workflows/agent-conversation-thread-p1-7b.yml"

concurrency:
  group: agent-conversation-thread-p1-7b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:conversation-thread:p1-7b

