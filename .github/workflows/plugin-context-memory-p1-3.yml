name: Plugin CI - Context Memory P1.3

on:
  push:
    branches: [main]
    paths:
      - "providers/context-memory/**"
      - "providers/context-memory-dlp/**"
      - "contracts/platform-services.ts"
      - "manager/context-memory-governance-**"
      - "manager/context-memory-retention-policy-store.ts"
      - "manager/context-memory-legal-hold-store.ts"
      - "manager/context-memory-policy-actions.ts"
      - "manager/context-memory-operations.ts"
      - "manager/context-memory-scheduler.ts"
      - "manager/context-memory-schedule-state-store.ts"
      - "manager/context-memory-store.ts"
      - "manager/server.ts"
      - "manager/memory-governance-page.ts"
      - "manager/app-host-client.ts"
      - "manager/localization.ts"
      - "help/content/**/memory-governance.md"
      - "tests/protocol/context-memory-p1-3-operations.test.mjs"
      - "tests/protocol/context-memory-retention-semantic-ec.test.mjs"
      - "tests/protocol/context-memory-intake.test.mjs"
      - "tests/protocol/context-memory-proposal-review.test.mjs"
      - "tests/protocol/context-memory-governance.test.mjs"
      - "package.json"
      - ".github/workflows/plugin-context-memory-p1-3.yml"
  pull_request:
    paths:
      - "providers/context-memory/**"
      - "providers/context-memory-dlp/**"
      - "contracts/platform-services.ts"
      - "manager/context-memory-governance-**"
      - "manager/context-memory-retention-policy-store.ts"
      - "manager/context-memory-legal-hold-store.ts"
      - "manager/context-memory-policy-actions.ts"
      - "manager/context-memory-operations.ts"
      - "manager/context-memory-scheduler.ts"
      - "manager/context-memory-schedule-state-store.ts"
      - "manager/context-memory-store.ts"
      - "manager/server.ts"
      - "manager/memory-governance-page.ts"
      - "manager/app-host-client.ts"
      - "manager/localization.ts"
      - "help/content/**/memory-governance.md"
      - "tests/protocol/context-memory-p1-3-operations.test.mjs"
      - "tests/protocol/context-memory-retention-semantic-ec.test.mjs"
      - "tests/protocol/context-memory-intake.test.mjs"
      - "tests/protocol/context-memory-proposal-review.test.mjs"
      - "tests/protocol/context-memory-governance.test.mjs"
      - "package.json"
      - ".github/workflows/plugin-context-memory-p1-3.yml"

concurrency:
  group: plugin-context-memory-p1-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:plugin:context-memory-p1-3
