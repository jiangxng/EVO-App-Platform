name: Plugin CI - Enterprise Agent

on:
  push:
    branches: [main]
    paths:
      - "agents/enterprise-agent/**"
      - "tests/agent/enterprise-agent.test.mjs"
      - "tests/app-host/agent-workspace.test.mjs"
  pull_request:
    paths:
      - "agents/enterprise-agent/**"
      - "tests/agent/enterprise-agent.test.mjs"
      - "tests/app-host/agent-workspace.test.mjs"

concurrency:
  group: plugin-enterprise-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:plugin:enterprise-agent
