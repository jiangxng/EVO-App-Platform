name: Project Continuity CI

on:
  push:
  pull_request:

concurrency:
  group: project-continuity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: node tools/project-continuity.mjs --check
      - name: Mandatory Human UI review before merge
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/ui-design-review-gate.mjs --self-test
          node tools/ui-design-review-gate.mjs "$BASE_SHA" "$HEAD_SHA"
