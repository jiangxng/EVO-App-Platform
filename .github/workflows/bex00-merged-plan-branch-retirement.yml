name: BEX-00 Merged Plan Branch Retirement
on:
  pull_request:
    paths:
      - "repository-hygiene/bex00-merged-plan-retirement-20261012.json"
      - ".github/workflows/bex00-merged-plan-branch-retirement.yml"
  push:
    branches: [main]
    paths:
      - "repository-hygiene/bex00-merged-plan-retirement-20261012.json"
permissions:
  contents: write
  pull-requests: read
jobs:
  verify-and-retire-plan-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact merged-PR audit; delete only on main push
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            if(owner!=='jiangxng'||repo!=='EVO-App-Platform')throw Error('Unexpected repository');
            const execute=context.eventName==='push'&&context.ref==='refs/heads/main';
            if(!execute&&context.eventName!=='pull_request')throw Error('Invalid workflow event');
            const headRef=execute?'main':context.payload.pull_request.head.sha;
            const d=(await github.rest.repos.getContent({
              owner,repo,path:'repository-hygiene/bex00-merged-plan-retirement-20261012.json',
              ref:headRef
            })).data;
            if(Array.isArray(d)||d.type!=='file')throw Error('Invalid manifest');
            const x=JSON.parse(Buffer.from(d.content,'base64').toString('utf8'));
            if(x.schemaVersion!==1||x.scope!=='bex00-merged-plan-retirement-20261012'
              ||x.branch!=='docs/foundation-list-experience-plan-20261012'
              ||x.expectedHeadSha!=='9a300c5319a19c40f30c137ff0a822273349d329'
              ||x.mergedViaPr!==785
              ||x.mergeCommitSha!=='b0da85bd42299f22eee648c1a581c883f4e8b285')
              throw Error('Unexpected retirement target');
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:785})).data;
            if(!pr.merged||pr.state!=='closed'||pr.base.ref!=='main'
              ||pr.head.repo?.full_name!==owner+'/'+repo
              ||pr.head.ref!==x.branch||pr.head.sha!==x.expectedHeadSha
              ||pr.merge_commit_sha!==x.mergeCommitSha)
              throw Error('PR #785 merge provenance does not match');
            const currentMain=(await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data.object.sha;
            const compare=(await github.rest.repos.compareCommits({
              owner,repo,base:x.mergeCommitSha,head:currentMain
            })).data;
            if(compare.behind_by!==0||compare.merge_base_commit?.sha!==x.mergeCommitSha)
              throw Error('Merged #785 is not in main history');
            const open=async()=>{
              const ps=(await github.rest.pulls.list({owner,repo,state:'open',per_page:100})).data;
              if(ps.length>=100)throw Error('Open PR set unbounded');
              const reserved=new Set(['main']);
              for(const p of ps){
                reserved.add(p.base.ref);
                if(p.head.repo?.full_name===owner+'/'+repo)reserved.add(p.head.ref);
              }
              return reserved;
            };
            if((await open()).has(x.branch))throw Error('Branch used by open PR');
            let ref;
            try {ref=(await github.rest.git.getRef({owner,repo,ref:'heads/'+x.branch})).data;}
            catch(e){if(execute&&e.status===404){core.info('ALREADY_ABSENT');return;}throw e;}
            if(ref.object.sha!==x.expectedHeadSha)throw Error('Branch SHA moved');
            const b=(await github.rest.repos.getBranch({owner,repo,branch:x.branch})).data;
            if(b.protected)throw Error('Protected branch');
            core.info('BEX00_MERGE_VERIFIED '+x.branch+' '+x.expectedHeadSha);
            if(!execute){core.info('AUDIT_ONLY_NO_DELETE');return;}
            if((await open()).has(x.branch))throw Error('Open PR claimed branch');
            const last=(await github.rest.git.getRef({owner,repo,ref:'heads/'+x.branch})).data;
            if(last.object.sha!==x.expectedHeadSha)throw Error('SHA moved before deletion');
            await github.rest.git.deleteRef({owner,repo,ref:'heads/'+x.branch});
            core.info('DELETED_BEX00_MERGED_PLAN_BRANCH '+x.branch);
