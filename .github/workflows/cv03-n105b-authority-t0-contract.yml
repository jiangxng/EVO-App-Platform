name: CV-03 N1-05b Opt-in PG Deny T0 Contract

on:
  pull_request:
    paths:
      - "manager/cv03-n105b-authority-t0-pg.ts"
      - "manager/cv03-n105b-pa05-host-lifecycle.ts"
      - "manager/cv03-personal-saved-view-host-admission.ts"
      - "tests/agent-line/cv03-n105b-authority-t0-contract.test.mjs"
      - "tests/agent-line/cv03-n105b-pa05-host-lifecycle.test.mjs"
      - "docs/plans/foundation-list-experience/CV03-N105B-01-APPROVED-A-DENY-T0-SEAM-20261111.md"
      - ".github/workflows/cv03-n105b-authority-t0-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optin-deny-t0-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Narrow T0 client validation (NO production DB or schema)
        run: node --test tests/agent-line/cv03-n105b-authority-t0-contract.test.mjs tests/agent-line/cv03-n105b-pa05-host-lifecycle.test.mjs
