name: Generate Package Lock

on:
  push:
    branches:
      - feat/dependency-lock-ci-v0.1
    paths:
      - "package.json"
      - ".github/workflows/generate-package-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dependency-lock-ci-v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify frozen install
        run: npm ci --ignore-scripts
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "Lock App Platform npm dependency graph"
            git push origin HEAD:feat/dependency-lock-ci-v0.1
          fi
