name: Plugin CI - Host Context Memory Provider

on:
  push:
    branches: [main]
    paths:
      - "providers/context-memory/**"
      - "contracts/platform-services.ts"
      - "manager/context-memory-store.ts"
      - "manager/context-memory-actions.ts"
      - "manager/server.ts"
      - "agents/enterprise-agent/**"
      - "tests/protocol/context-memory-governance.test.mjs"
      - "tests/protocol/person-first-context.test.mjs"
      - "package.json"
      - ".github/workflows/plugin-host-context-memory-provider.yml"
  pull_request:
    paths:
      - "providers/context-memory/**"
      - "contracts/platform-services.ts"
      - "manager/context-memory-store.ts"
      - "manager/context-memory-actions.ts"
      - "manager/server.ts"
      - "agents/enterprise-agent/**"
      - "tests/protocol/context-memory-governance.test.mjs"
      - "tests/protocol/person-first-context.test.mjs"
      - "package.json"
      - ".github/workflows/plugin-host-context-memory-provider.yml"

concurrency:
  group: plugin-host-context-memory-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:plugin:host-context-memory-provider
