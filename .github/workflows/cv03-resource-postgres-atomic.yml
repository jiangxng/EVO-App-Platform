name: CV-03 Enterprise Resource PostgreSQL Atomic CAS

on:
  pull_request:
    paths:
      - "contracts/enterprise-resource.ts"
      - "providers/enterprise-context/resources.ts"
      - "providers/enterprise-context/resources-postgres.ts"
      - "tests/agent-line/cv03-resource-postgres-conditional.test.mjs"
      - "providers/enterprise-context/personal-saved-views.ts"
      - "manager/cv03-personal-saved-view-host-issuer.ts"
      - "manager/cv03-personal-saved-view-host-admission.ts"
      - "manager/server.ts"
      - "tests/agent-line/cv03-n104j-real-host-startup-quarantine.test.mjs"
      - "manager/store.ts"
      - "tests/agent-line/cv03-n104i-file-lifecycle-io.test.mjs"
      - "providers/enterprise-context/resource-receipt-digest.ts"
      - "tests/agent-line/cv03-personal-saved-view-postgres.test.mjs"
      - "tests/agent-line/cv03-resource-postgres-atomic-receipt.test.mjs"
      - "tests/agent-line/cv03-postgres-runtime-role-admission.test.mjs"
      - "tests/agent-line/cv03-n1-signed-sql-gateway.test.mjs"
      - "tests/agent-line/cv03-n104b-tenant-read-isolation.test.mjs"
      - "tests/agent-line/cv03-n104c-authenticated-authority-event.test.mjs"
      - "tests/agent-line/cv03-n104d-pa05-real-manager-authority.test.mjs"
      - "tools/cv03-n104d-isolated-pa05-manager-authority.mjs"
      - "tools/cv03-n104e-domain-owner-namespace.mjs"
      - "tools/cv03-n104f-isolated-authority-tx-outbox.mjs"
      - "tools/cv03-n104h-isolated-producer-fence.mjs"
      - "tools/cv03-n104g-isolated-outbox-bound-delivery.mjs"
      - "tests/agent-line/cv03-n104f-authority-tx-outbox-recovery.test.mjs"
      - "tools/cv03-n104c-isolated-authority-event-bridge.mjs"
      - "tools/cv03-n1-isolated-tenant-read-gateway.mjs"
      - "tools/cv03-n1-isolated-signed-sql-gateway.mjs"
      - "tools/cv03-n1-postgres-role-audit.mjs"
      - "tests/fixtures/cv03-resource-postgres-child.mjs"
      - "tests/fixtures/cv03-n1-gateway-provider-child.mjs"
      - ".github/workflows/cv03-resource-postgres-atomic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres-resource-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cv03proof
          POSTGRES_PASSWORD: cv03proof
          POSTGRES_DB: cv03proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv03proof -d cv03proof"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      CV03_RESOURCE_PROOF_DATABASE_URL: postgres://cv03proof:cv03proof@127.0.0.1:5432/cv03proof
      CV03_N1_ONLY_ISOLATED_GATEWAY_TEST: YES_CI_LOCAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      # Test files share one PG18 service/pgcrypto extension; serialize
      # schema-global DDL initialization. Internal two-worker CAS tests remain concurrent.
      - run: node --test --test-concurrency=1 tests/agent-line/cv03-n104i-file-lifecycle-io.test.mjs tests/agent-line/cv03-n104j-real-host-startup-quarantine.test.mjs tests/agent-line/cv03-resource-postgres-conditional.test.mjs tests/agent-line/cv03-personal-saved-view-postgres.test.mjs tests/agent-line/cv03-resource-postgres-atomic-receipt.test.mjs tests/agent-line/cv03-postgres-runtime-role-admission.test.mjs tests/agent-line/cv03-n1-signed-sql-gateway.test.mjs tests/agent-line/cv03-n104b-tenant-read-isolation.test.mjs tests/agent-line/cv03-n104c-authenticated-authority-event.test.mjs tests/agent-line/cv03-n104d-pa05-real-manager-authority.test.mjs tests/agent-line/cv03-n104f-authority-tx-outbox-recovery.test.mjs
