name: TR01 Peer Purchase Receiving Native Plugin Gate

on:
  pull_request:
    paths:
      - "apps/trading-stage/**"
      - "apps/trading-stage-purchasing/**"
      - "apps/trading-stage-receiving/**"
      - "tests/protocol/tr01-trading-peer-purchasing-receiving.test.mjs"
      - ".github/workflows/tr01-peer-purchasing-receiving.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-native-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Six independent packages and native Eidos lifecycle
        run: node --test tests/protocol/tr01-trading-peer-purchasing-receiving.test.mjs
      - name: Retain previous four peer package proof
        run: node --test tests/protocol/tr01b2d3-four-peer-stage-plugins.test.mjs
      - name: Generic Host boundary stays unchanged
        run: |
          git diff --exit-code HEAD^ HEAD -- manager/server.ts catalog/seed.ts || true
          node tools/eidos-design-language-validate.mjs
          node tools/eidos-experience-architecture-validate.mjs
