name: Plugin CI - Template Store

on:
  push:
    branches: [main]
    paths:
      - "apps/template-store/**"
      - "contracts/template-transfer.ts"
      - "contracts/enterprise-business-definition.ts"
      - "providers/enterprise-context/template-transfer.ts"
      - "providers/enterprise-context/business-definitions.ts"
      - "providers/enterprise-context/package.ts"
      - "catalog/seed.ts"
      - "manager/server.ts"
      - "vendor/eidos/src/catalog-browser/**"
      - "vendor/eidos/src/design-language/productive-workbench-css.ts"
      - "vendor/eidos/source.manifest.json"
      - "tests/integration/template-store-plugin.test.mjs"
      - "tests/protocol/template-store-transfer-boundary.test.mjs"
      - "package.json"
      - ".github/workflows/plugin-template-store.yml"
  pull_request:
    paths:
      - "apps/template-store/**"
      - "catalog/seed.ts"
      - "manager/server.ts"
      - "vendor/eidos/src/catalog-browser/**"
      - "vendor/eidos/src/design-language/productive-workbench-css.ts"
      - "vendor/eidos/source.manifest.json"
      - "tests/integration/template-store-plugin.test.mjs"
      - "package.json"
      - ".github/workflows/plugin-template-store.yml"

concurrency:
  group: plugin-template-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:plugin:template-store
