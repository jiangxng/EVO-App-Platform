name: Surface Scoped Loading Production Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/surface-scoped-loading-production-proof.yml"
      - "tools/browser-surface-network-proof.mjs"

permissions:
  contents: read

jobs:
  network-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Surface-scoped production network graph
        shell: bash
        env:
          HOST: https://ledger-configurator-production.up.railway.app
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary available on runner" >&2
            exit 1
          fi
          export CHROME
          node tools/browser-surface-network-proof.mjs | tee /tmp/surface-loading-proof.log
          grep -q "SURFACE_LOADING_PROOF=" /tmp/surface-loading-proof.log
