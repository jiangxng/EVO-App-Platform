name: Real Browser RUM Budget Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/real-browser-rum-budget-proof.yml"
      - "tools/real-browser-rum-budget-proof.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/real-browser-rum-budget-proof.yml"
      - "tools/real-browser-rum-budget-proof.mjs"
      - "manager/browser-performance.ts"
      - "manager/web-performance.ts"
      - "manager/web-performance-budgets.ts"

permissions:
  contents: read

jobs:
  real-browser-rum-budget-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify real browser RUM and Surface budgets
        env:
          HOST: https://ledger-configurator-production.up.railway.app
        shell: bash
        run: |
          set -euo pipefail

          # A main push is not automatically equivalent to a production deploy.
          # Only runtime files that affect the reporter/store/budgets require the
          # proof to wait for this exact revision. Workflow/tool-only changes
          # validate the currently deployed production revision instead.
          EXPECTED_REVISION=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              if git diff --name-only "$BEFORE" "$GITHUB_SHA" --                 manager/browser-performance.ts                 manager/web-performance.ts                 manager/web-performance-budgets.ts                 | grep -q .; then
                EXPECTED_REVISION="$GITHUB_SHA"
              fi
            fi
          fi
          export EXPECTED_REVISION

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary available on runner" >&2
            exit 1
          fi
          export CHROME
          node tools/real-browser-rum-budget-proof.mjs | tee /tmp/real-browser-rum-budget-proof.log
          grep -q "REAL_BROWSER_RUM_BUDGET_PROOF=" /tmp/real-browser-rum-budget-proof.log
